<style>
:root{
  --luft:#e9edf1; --flade:#fff; --blæk:#0e1620; --dæmpet:#5a6673;
  --hårfin:#d3dae1; --sbus:#ffd400; --letbane:#32ac5c; --stog:#b7202e;
  --forsinket:#a35400; --aflyst:#c1121f; --god:#1f7a44; --stram:#8a6a1f;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--luft);color:var(--blæk);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:18px 16px 40px;}
.ramme{max-width:820px;margin:0 auto;}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}

/* ── hovedet ─────────────────────────────────────────────── */
.hoved{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;}
.titelblok{display:flex;flex-direction:column;gap:1px;}
h1{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;
  font-size:29px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.05;}
.beta{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#fff;background:var(--dæmpet);
  padding:2px 7px;border-radius:2px;margin-left:9px;vertical-align:3px;}
.dato{color:var(--dæmpet);font-size:13px;}
.højre{margin-left:auto;display:flex;align-items:center;gap:14px;}
.vejrnu{display:flex;align-items:center;gap:6px;}
.vejrnu b{font-size:19px;font-weight:600;}
.ur{font-weight:500;font-size:22px;}
.vejrikon{display:inline-flex;align-items:center;line-height:0;}
.vejrikon svg{display:block;overflow:visible;}

.puls{width:8px;height:8px;border-radius:50%;background:var(--god);display:inline-block;
  vertical-align:middle;margin-right:6px;animation:ånde 3.2s ease-in-out infinite;}
.puls.arbejder{animation:ånde .8s ease-in-out infinite;}
.puls.gammel{background:var(--stram);}
.puls.sover{background:var(--dæmpet);animation:none;opacity:.5;}
.puls.gal{background:var(--aflyst);animation:ånde 1.4s ease-in-out infinite;}
@keyframes ånde{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.78);}}

.skinne{height:2px;background:var(--blæk);position:relative;overflow:hidden;}
.fremdrift{position:absolute;left:0;top:0;height:100%;width:0;
  background:var(--letbane);transition:width .9s linear;}
.fremdrift.arbejder{background:var(--sbus);transition:none;}

.knapper{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px;}
button{font-family:inherit;font-size:13px;font-weight:500;background:var(--flade);
  color:var(--blæk);border:1px solid var(--hårfin);border-radius:var(--radius);
  padding:7px 13px;cursor:pointer;transition:border-color .15s,background .15s;}
button:hover{border-color:var(--blæk);}
button:active{transform:translateY(1px);}
button[aria-pressed="true"]{background:var(--blæk);color:#fff;border-color:var(--blæk);}
button:focus-visible{outline:2px solid var(--stog);outline-offset:2px;}
#knapVend{font-weight:600;}
.forklar{font-size:12.5px;color:var(--dæmpet);margin:0 0 16px;}

/* ── status: rolig, ikke alarmerende ─────────────────────── */
.status{font-size:13px;color:var(--dæmpet);background:var(--flade);
  border:1px solid var(--hårfin);border-radius:var(--radius);padding:9px 14px;margin-bottom:14px;}
.status.advarsel{border-left:3px solid var(--stram);}
.status.fejl{border-left:3px solid var(--aflyst);}
.status b{color:var(--blæk);font-weight:600;}
.status button{margin-left:10px;padding:3px 10px;font-size:12px;}

.drift{background:var(--flade);border:1px solid var(--hårfin);border-left:3px solid var(--forsinket);
  border-radius:var(--radius);padding:11px 14px;margin-bottom:14px;font-size:13.5px;}
.drift p{margin:0;}
.drift p + p{margin-top:7px;padding-top:7px;border-top:1px solid #eef1f4;}
.drift b{font-weight:600;}
.drift span{color:var(--dæmpet);}

/* ── listen ──────────────────────────────────────────────── */
.kort{background:var(--flade);border:1px solid var(--hårfin);border-radius:var(--radius);overflow:hidden;}
.blok + .blok{border-top:9px solid var(--luft);}
.bånd{display:flex;align-items:center;gap:9px;padding:7px 16px;background:#eaeef2;
  border-bottom:1px solid var(--hårfin);}
.bånd .etiket{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dæmpet);}
.bånd b{font-size:17px;font-weight:600;}
.bånd .antal{font-size:12px;color:var(--dæmpet);}
.bånd .vejrder{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:17px;color:var(--dæmpet);}
.bånd .vejrder b{font-size:17px;}
.bånd .vejrder.vådt{color:var(--stram);}

.rk{display:grid;grid-template-columns:76px auto 1fr;gap:3px 12px;align-items:baseline;
  padding:10px 16px;border-top:1px solid #eef1f4;cursor:pointer;transition:background .15s;}
.rk:first-of-type,.bånd + .rk{border-top:none;}
.rk:hover{background:#f4f7fa;}
.rk.ændret{animation:blink 1.6s ease-out;}
@keyframes blink{0%{background:#fff7d6;}100%{background:transparent;}}
.rk.gammel{opacity:.6;}
/* den nære afgang: en rolig puls i venstre kant, så øjet finder den */
.rk.snart{box-shadow:inset 3px 0 0 var(--stram);animation:kant 2.4s ease-in-out infinite;}
.rk.nu{box-shadow:inset 3px 0 0 var(--god);}
@keyframes kant{0%,100%{box-shadow:inset 3px 0 0 var(--stram);}50%{box-shadow:inset 3px 0 0 #e8cf8a;}}
.afg .presser{color:var(--stram);font-weight:600;}
.bånd .omfremme{margin-left:auto;font-size:12px;color:var(--dæmpet);}
.bånd .vejrder{margin-left:14px;}
.rk.knap{opacity:.55;}
.rk.aflyst{cursor:default;}
.rk.aflyst:hover{background:transparent;}

/* øverste linje: klokkeslæt og nedtælling side om side */
.afg{grid-column:1 / -1;display:flex;align-items:baseline;gap:9px;white-space:nowrap;}
.afg b{font-size:18px;font-weight:600;line-height:1.15;}
.afg span{font-size:12px;color:var(--dæmpet);}
.afg em{font-style:normal;color:var(--forsinket);font-weight:600;}
.rk.aflyst .afg b{text-decoration:line-through;opacity:.5;}
.aflystmærkat{color:var(--aflyst);font-weight:600;}

.mærke{display:inline-block;min-width:44px;text-align:center;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:12.5px;
  padding:2px 6px;border-radius:var(--radius);background:var(--blæk);color:#fff;}
.mærke.bus{background:var(--sbus);color:#1a1a00;}
.mærke.letbane{background:var(--letbane);color:#fff;}
.mærke.stog{background:var(--stog);color:#fff;}
.rk.aflyst .mærke{opacity:.45;}
/* mærket står foran vejene, ikke oppe ved tiden */
.medlinje{grid-column:1;justify-self:start;}

/* mulighederne videre — én linje per vej */
.veje{grid-column:2 / -1;display:flex;flex-direction:column;gap:4px;}
.vej{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dæmpet);white-space:nowrap;}
.vej .skift{min-width:112px;}
.vej .vent{font-weight:600;font-style:normal;}
.vej .vent.ok{color:var(--god);}
.vej .vent.stram{color:var(--stram);}
.vej .pil{color:var(--hårfin);}
.vej .via{font-size:11.5px;}
.rk.aflyst .vej{text-decoration:line-through;opacity:.6;}

.tom{padding:20px 16px;font-size:13.5px;color:var(--dæmpet);}

/* ── den rejse du følger ─────────────────────────────────── */
.låsboks{background:var(--flade);border:1px solid var(--blæk);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;}
.låsboks.forstyrret{border-color:var(--aflyst);}
.låstop{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--blæk);}
.låsboks.forstyrret .låstop{background:var(--aflyst);}
.låsmærkat{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:#fff;}
.slipknap{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);padding:3px 11px;font-size:12px;}
.slipknap:hover{border-color:#fff;background:rgba(255,255,255,.14);}

.trin{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  padding:11px 16px;border-top:1px solid #eef1f4;}
.trinrute{font-size:13.5px;}
.trintider{font-size:12.5px;color:var(--dæmpet);}
.trintider em{font-style:normal;color:var(--forsinket);font-weight:600;}
.trinstatus{font-size:12px;white-space:nowrap;text-align:right;color:var(--dæmpet);}
.trinstatus.kører{color:var(--god);font-weight:600;}
.trinstatus.færdig{opacity:.55;}
.trinstatus.aflystnu{color:var(--aflyst);font-weight:600;}
.trin.trinaflyst{opacity:.55;}
.trin.trinaflyst .trinrute,.trin.trinaflyst .trintider{text-decoration:line-through;}
.trinskift{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 16px;background:#f2f5f8;font-size:13px;color:var(--dæmpet);border-top:1px solid #eef1f4;}
.skiftdom{font-weight:600;white-space:nowrap;}
.skiftdom.holder{color:var(--god);}
.skiftdom.stramt{color:var(--stram);}
.skiftdom.mistet{color:var(--aflyst);}
.skiftdom.færdig{color:var(--dæmpet);font-weight:400;}
.erstattet{padding:5px 16px;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--aflyst);background:#fdf3f3;border-top:1px solid #f6e2e2;}
.låsfod{display:flex;align-items:baseline;gap:10px;padding:11px 16px;border-top:1px solid var(--hårfin);}
.fodmærkat{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dæmpet);}
.låsfod b{font-size:21px;font-weight:600;}
.fodrest{font-size:12.5px;color:var(--dæmpet);margin-left:auto;}
.fodrest.skredet{color:var(--aflyst);font-weight:600;}
.låstom{margin:0;padding:14px 16px;font-size:13.5px;color:var(--dæmpet);}

.fod{margin-top:20px;font-size:12px;color:var(--dæmpet);}

@media(max-width:640px){
  .rk{grid-template-columns:auto 1fr;padding:10px 14px;}
  .vej .skift{min-width:0;}
  .trin{grid-template-columns:auto 1fr;row-gap:4px;}
  .trinstatus{grid-column:2;text-align:left;}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="ramme">
  <header class="hoved">
    <div class="titelblok">
      <h1><span id="titel">Hjem</span><span class="beta">beta 2</span></h1>
      <span class="dato" id="dato"></span>
    </div>
    <div class="højre">
      <span class="vejrnu" id="vejrnu"></span>
      <span class="ur mono"><span class="puls" id="puls"></span><span id="ur">--:--</span></span>
    </div>
  </header>
  <div class="skinne"><div class="fremdrift" id="fremdrift"></div></div>

  <div class="knapper">
    <button id="knapVend">Vend rejsen</button>
    <button id="knapOpdater">Opdater nu</button>
    <button id="knapFlere" aria-pressed="false">Flere rejser</button>
    <button id="knapAlt" aria-pressed="false">Vis 166</button>
  </div>
  <p class="forklar" id="forklar"></p>

  <div id="status"></div>
  <div id="låst"></div>
  <div id="drift"></div>
  <div class="kort" id="liste"></div>
  <p class="fod" id="fod">Henter …</p>
</div>

<script>
(function(){
"use strict";

/* ─────────────────────────────────────────────────────────
   Hjælpere
   ───────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const el = (t,k) => { const n=document.createElement(t); if(k) n.className=k; return n; };
const to = n => String(n).padStart(2,"0");
const urTekst = d => to(d.getHours())+":"+to(d.getMinutes());
const minutter = (a,b) => Math.round((b-a)/60000);
const varighed = m => m>=60 ? Math.floor(m/60)+" t "+(m%60)+" m" : m+" min";
function idag(){ const d=new Date(); return d.getFullYear()+"-"+to(d.getMonth()+1)+"-"+to(d.getDate()); }
function datoTekst(d){
  const uge=["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
  const mdr=["jan.","feb.","mar.","apr.","maj","jun.","jul.","aug.","sep.","okt.","nov.","dec."];
  return uge[d.getDay()]+" "+d.getDate()+". "+mdr[d.getMonth()];
}
function tilDato(dato,tid){
  if(!dato||!tid) return null;
  const d=dato.split("-").map(Number), t=tid.split(":").map(Number);
  return new Date(d[0],d[1]-1,d[2],t[0],t[1],t[2]||0);
}
function nedtæl(mål, nu){
  const s = Math.round((mål - nu)/1000);
  if(s <= 0)  return "nu";
  if(s < 600) return "om " + Math.floor(s/60) + ":" + to(s%60);
  return "om " + Math.round(s/60) + " min";
}
function mærke(t,a){ const m=el("span","mærke "+a); m.textContent=t; return m; }

/* ─────────────────────────────────────────────────────────
   Vejr — ikoner tegnet her, farver der siger noget
   ───────────────────────────────────────────────────────── */
const SOL="#e0a132", SKY="#93a2b0", REGN="#3d7ab8", SNE="#79aed4";
const SKYFORM='<path d="M7.2 18h9.3a3.9 3.9 0 0 0 .4-7.8 5.4 5.4 0 0 0-10.3 1.6A3.3 3.3 0 0 0 7.2 18z"';
function svgSol(x,y,r){
  let ud='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+SOL+'"/><g stroke="'+SOL+'" stroke-width="1.6" stroke-linecap="round">';
  [[0,-1],[0,1],[-1,0],[1,0],[-.71,-.71],[.71,.71],[-.71,.71],[.71,-.71]].forEach(d=>{
    ud+='<line x1="'+(x+d[0]*(r+1.8)).toFixed(1)+'" y1="'+(y+d[1]*(r+1.8)).toFixed(1)
      +'" x2="'+(x+d[0]*(r+3.9)).toFixed(1)+'" y2="'+(y+d[1]*(r+3.9)).toFixed(1)+'"/>';});
  return ud+'</g>';
}
function dråber(f,n,y){
  let ud='<g stroke="'+f+'" stroke-width="1.9" stroke-linecap="round">';
  (n===2?[9.5,14.5]:[8,12,16]).forEach(px=>{ud+='<line x1="'+px+'" y1="'+y+'" x2="'+(px-1.2)+'" y2="'+(y+3.6)+'"/>';});
  return ud+'</g>';
}
function fnug(){ return '<g fill="'+SNE+'"><circle cx="8.5" cy="21" r="1.15"/><circle cx="12" cy="22.2" r="1.15"/><circle cx="15.5" cy="21" r="1.15"/></g>'; }
function vejrTegning(k){
  if(k===0) return svgSol(12,12,5.2);
  if(k===1||k===2) return svgSol(8.5,8.5,3.6)+SKYFORM+' fill="'+SKY+'"/>';
  if(k===3) return SKYFORM+' fill="'+SKY+'"/>';
  if(k===45||k===48) return SKYFORM+' fill="'+SKY+'" opacity=".75"/><g stroke="'+SKY+'" stroke-width="1.7" stroke-linecap="round"><line x1="6" y1="20.5" x2="18" y2="20.5"/><line x1="8" y1="23" x2="16" y2="23"/></g>';
  if(k>=51&&k<=57) return SKYFORM+' fill="'+SKY+'"/>'+dråber(REGN,2,19.5);
  if((k>=61&&k<=67)||(k>=80&&k<=82)) return SKYFORM+' fill="'+SKY+'"/>'+dråber(REGN,3,19.5);
  if((k>=71&&k<=77)||(k>=85&&k<=86)) return SKYFORM+' fill="'+SKY+'"/>'+fnug();
  if(k>=95) return SKYFORM+' fill="'+SKY+'"/><polygon points="12.8,18.6 9.2,23.4 11.6,23.4 10.4,27 14.6,21.6 12,21.6" fill="'+SOL+'"/>';
  return '<circle cx="12" cy="12" r="3" fill="'+SKY+'"/>';
}
function vejrIkon(k,px){
  const s=el("span","vejrikon");
  s.innerHTML='<svg viewBox="0 0 24 28" width="'+px+'" height="'+px+'" aria-hidden="true">'+vejrTegning(k)+'</svg>';
  return s;
}
function vejrOrd(k){
  if(k===0) return "klart"; if(k===1||k===2) return "let skyet"; if(k===3) return "overskyet";
  if(k===45||k===48) return "tåge"; if(k>=51&&k<=57) return "finregn";
  if(k>=61&&k<=67) return "regn"; if(k>=71&&k<=77) return "sne";
  if(k>=80&&k<=82) return "byger"; if(k>=85&&k<=86) return "snebyger"; if(k>=95) return "tordenvejr";
  return "";
}
let vejret = {};
async function hentVejr(){
  const nøgler = Object.keys(VEJRSTEDER);
  const svar = await Promise.all(nøgler.map(async n => {
    const s = VEJRSTEDER[n];
    try{
      const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude="+s.lat+"&longitude="+s.lon
        +"&current=temperature_2m,weather_code,precipitation&hourly=temperature_2m,weather_code,precipitation"
        +"&timezone=Europe%2FCopenhagen&forecast_days=2");
      const d = await r.json();
      const t = (d.hourly && d.hourly.time) || [];
      return { navn:s.navn,
        nu: d.current ? { kode:d.current.weather_code, grader:Math.round(d.current.temperature_2m), nedbør:d.current.precipitation } : null,
        timer: t.map((tid,i)=>({ tid:tid, kode:d.hourly.weather_code[i], grader:Math.round(d.hourly.temperature_2m[i]), nedbør:d.hourly.precipitation[i] })) };
    }catch(e){ return null; }
  }));
  const ud = {};
  nøgler.forEach((n,i)=>{ if(svar[i]) ud[n]=svar[i]; });
  if(Object.keys(ud).length) vejret = ud;
}
function vejrPå(sted, tid){
  const v = vejret[sted]; if(!v) return null;
  const m = tid.getFullYear()+"-"+to(tid.getMonth()+1)+"-"+to(tid.getDate())+"T"+to(tid.getHours())+":00";
  return v.timer.filter(x => x.tid === m)[0] || null;
}

/* ─────────────────────────────────────────────────────────
   Rejseplanen — hentning og tolkning af ét ben.
   Tolkningen er den prøvede fra v4: aflysninger står tre steder.
   ───────────────────────────────────────────────────────── */
async function kald(url){
  const svar = await fetch(url);
  const data = await svar.json().catch(()=>null);
  if(!data) throw new Error("Uforståeligt svar fra Rejseplanen.");
  if(data.errorCode) throw new Error(data.errorText||data.errorCode);
  return data;
}
function bygBen(fra,til,produkter,sammenhæng,tid){
  let u = FUNKTION + "?sti=trip&rtMode=REALTIME"
    + "&originId=" + encodeURIComponent(fra) + "&destId=" + encodeURIComponent(til)
    + "&products=" + produkter + "&maxChange=0&numF=" + PER_SØGNING;
  if(tid) u += "&date="+tid.getFullYear()+"-"+to(tid.getMonth()+1)+"-"+to(tid.getDate())
             + "&time="+to(tid.getHours())+":"+to(tid.getMinutes());
  if(sammenhæng) u += "&context=" + encodeURIComponent(sammenhæng);
  return u;
}
async function hentBen(fra,til,produkter,sider,tid){
  const f = await kald(bygBen(fra,til,produkter,null,tid));
  let ture = Array.isArray(f.Trip)?f.Trip.slice():(f.Trip?[f.Trip]:[]);
  let s = f.scrF;
  for(let i=1;i<sider && s;i++){
    try{
      const x = await kald(bygBen(fra,til,produkter,s,tid));
      ture = ture.concat(Array.isArray(x.Trip)?x.Trip:(x.Trip?[x.Trip]:[]));
      s = x.scrF;
    }catch(e){ break; }
  }
  return ture.map(tolkBen).filter(Boolean);
}
const produktAf = b => Array.isArray(b.Product)?(b.Product[0]||{}):(b.Product||{});
const tidAf = (p,rt) => rt ? tilDato(p.rtDate||p.date,p.rtTime||p.time) : tilDato(p.date,p.time);
function artAf(p){
  const k=((p&&(p.catOutL||p.catOut))||"").toLowerCase();
  if(k.indexOf("letbane")>-1) return "letbane";
  if(k.indexOf("tog")>-1) return "stog";
  return "bus";
}
function erAflyst(o){
  if(!o) return false;
  if(o.cancelled===true||o.cancelled==="true") return true;
  if(o.cancelledDeparture===true||o.cancelledArrival===true) return true;
  const n=o.Notes&&o.Notes.Note; const noter=Array.isArray(n)?n:(n?[n]:[]);
  return noter.some(x=>x&&(x.cancelled===true||x.cancelled==="true"||String(x.key||"").indexOf("cancelled")>-1));
}
const benAflyst = b => erAflyst(b)||erAflyst(b.Origin)||erAflyst(b.Destination);
function tolkBen(trip){
  const alle=(trip.LegList&&trip.LegList.Leg)||[];
  const ben=(Array.isArray(alle)?alle:[alle]).filter(b=>b.type!=="WALK"&&b.Product);
  if(ben.length!==1) return null;
  const b=ben[0], p=produktAf(b);
  const planlagt=tidAf(b.Origin,false), afgang=tidAf(b.Origin,true)||planlagt;
  const planAnk=tidAf(b.Destination,false), ankomst=tidAf(b.Destination,true)||planAnk;
  if(!afgang||!ankomst) return null;
  return {
    linje: p.line||(b.name||"").replace(/^(Bus|S-tog|Letbane)\s+/i,"").trim(),
    art: artAf(p),
    planlagt: planlagt, afgang: afgang, planAnk: planAnk, ankomst: ankomst,
    forsinkelse: minutter(planlagt,afgang), ankForsinkelse: planAnk ? minutter(planAnk,ankomst) : 0,
    aflyst: erAflyst(trip)||benAflyst(b),
    videre: null
  };
}

/* ─────────────────────────────────────────────────────────
   LAGERET — tavlens hukommelse.
   Kendte afgange bliver liggende. Nye data flettes ind og
   opdaterer kun det der er ændret. En fejlet hentning rører
   ingenting. Ben ældre end en time ryddes ud.
   ───────────────────────────────────────────────────────── */
const lager = {};   // rute.navn → { et: Map, to: Map }
const RYD_MINUTTER = 60;

/* Hylden er delt op på RETNING. Uden det blander hjem- og udturens
   ben sig, og så kobles en letbane til en letbane.                */
function hylde(rute){
  const n = (hjemad ? "hjem" : "ud") + "|" + rute.navn;
  if(!lager[n]) lager[n] = { et:new Map(), to:new Map() };
  return lager[n];
}
const benNøgle = b => b.linje+"|"+(+b.planlagt)+"|"+(b.videre?b.videre.linje+"|"+(+b.videre.planlagt):"");

/* fletter en liste ben ind i et Map; returnerer nøglerne på det der ændrede sig */
function flet(kort, liste, nu, førsteGang){
  const ændrede = [];
  liste.forEach(b => {
    const n = benNøgle(b);
    const før = kort.get(n);
    b.set = nu;
    if(før){
      if(+før.afgang !== +b.afgang || +før.ankomst !== +b.ankomst || før.aflyst !== b.aflyst) ændrede.push(n);
    }else if(!førsteGang) ændrede.push(n);   // nye rækker blinker — men ikke hele tavlen ved start
    kort.set(n, b);
  });
  return ændrede;
}
function ryd(kort, nu){
  kort.forEach((b,n) => { if(nu - b.afgang > RYD_MINUTTER*60000) kort.delete(n); });
}

/* ─────────────────────────────────────────────────────────
   Tilstand og hentning
   ───────────────────────────────────────────────────────── */
let hjemad=true, visFlere=false, visAlt=false;
let lås=null;
const stat = { sidstHentet:0, sidstForsøgt:0, sidstFejl:null, sidstDrift:0, sidstVejr:0,
               drift:[], tomme:[], henter:false, sover:false, sidsteAktivitet:Date.now(),
               ændrede:new Set() };

function aktiv(rute){ return !(rute.valgfri && !visAlt); }
const stedHer = () => hjemad ? "gladsaxe" : "ølstykke";
const stedDer = () => hjemad ? "ølstykke" : "gladsaxe";

/* omvejen over Ballerup: to direkte strækninger syet sammen. Rejseplanen
   foreslår den aldrig, fordi den aldrig er hurtigere — kun lige så hurtig. */
async function hentOmvej(fraId, sider){
  const [et, to_] = await Promise.all([
    hentBen(fraId, BALLERUP_ST, S_TOG, sider),
    hentBen(BALLERUP_ST, HJEM.id, S_TOG, sider)
  ]);
  const ud = [];
  et.forEach(a => {
    if(a.aflyst || String(a.linje).toUpperCase() !== "H") return;
    const grænse = new Date(a.ankomst.getTime() + SKIFT_BALLERUP*60000);
    let b = null;
    for(let i=0;i<to_.length;i++){ if(!to_[i].aflyst && to_[i].afgang >= grænse){ b=to_[i]; break; } }
    if(!b) return;
    ud.push({ linje:a.linje, art:a.art, planlagt:a.planlagt, afgang:a.afgang,
      planAnk:b.planAnk, ankomst:b.ankomst, forsinkelse:a.forsinkelse, ankForsinkelse:b.ankForsinkelse,
      aflyst:false,
      videre:{ linje:b.linje, art:b.art, sted:"Ballerup", planlagt:b.planlagt, afgang:b.afgang,
               ankomst:b.ankomst, forsinkelse:b.forsinkelse, fraAnkomst:a.ankomst,
               vent:minutter(a.ankomst,b.afgang) } });
  });
  return ud;
}

async function hentAfgange(){
  if(stat.henter) return;
  stat.henter = true; tegnPuls();
  const nu = new Date();
  const brug = RUTER.filter(aktiv);
  const sider = visFlere ? SIDER_FLERE : SIDER_NORMALT;
  const tomme = [], fejl = [];
  stat.ændrede = new Set();

  await Promise.all(brug.map(async rute => {
    const h = hylde(rute);
    /* følger du en rejse der er kørt, hentes dens ben fra lidt før afgang —
       ellers får vi ingen realtid på et køretøj du sidder i. Ét kald ekstra. */
    const følger = lås && lås.hjemad===hjemad && lås.rute===rute.navn
                   && lås.etPlanlagt < nu.getTime() && lås.etPlanlagt > nu.getTime()-40*60000;
    const bagud = følger ? new Date(lås.etPlanlagt - 5*60000) : null;
    try{
      let et, to_;
      if(hjemad){
        const [a, b, o, ab] = await Promise.all([
          hentBen(rute.lokalId, rute.skiftAf, rute.produkter, 1),
          hentBen(rute.skiftPå, HJEM.id, S_TOG, sider),
          rute.omvej ? hentOmvej(rute.skiftPå, sider).catch(()=>[]) : Promise.resolve([]),
          bagud ? hentBen(rute.lokalId, rute.skiftAf, rute.produkter, 1, bagud).catch(()=>[]) : Promise.resolve([])
        ]);
        et = a.concat(ab); to_ = b.concat(o);
      }else{
        const [a, b, ab] = await Promise.all([
          hentBen(HJEM.id, rute.skiftPå, S_TOG, 1),
          hentBen(rute.skiftAf, rute.lokalId, rute.produkter, sider),
          bagud ? hentBen(HJEM.id, rute.skiftPå, S_TOG, 1, bagud).catch(()=>[]) : Promise.resolve([])
        ]);
        et = a.concat(ab); to_ = b;
      }
      if(rute.linjer) et = et.filter(x => rute.linjer.some(l => l.toUpperCase()===String(x.linje).toUpperCase()));
      flet(h.et, et, nu, !stat.sidstHentet).forEach(n => stat.ændrede.add(rute.navn+"|"+n));
      flet(h.to, to_, nu, true);
      ryd(h.et, nu); ryd(h.to, nu);
    }catch(e){
      const t = String(e.message||e);
      if(t.indexOf("H890")>-1 || t.toLowerCase().indexOf("no result")>-1) tomme.push(rute.navn);
      else fejl.push(rute.navn+": "+t);
    }
  }));

  stat.sidstForsøgt = Date.now();
  if(fejl.length && fejl.length === brug.length){ stat.sidstFejl = fejl.join("; "); }
  else { stat.sidstFejl = fejl.length ? fejl.join("; ") : null; stat.sidstHentet = Date.now(); }
  stat.tomme = tomme;
  stat.henter = false;
  byg();
}

async function hentDrift(){
  try{
    const d = await kald(FUNKTION+"?sti=himsearch");
    const rå = d.Message; const liste = Array.isArray(rå)?rå:(rå?[rå]:[]);
    stat.drift = liste.filter(vedkommer).slice(0,3);
  }catch(e){}
  stat.sidstDrift = Date.now(); byg();
}
function vedkommer(m){
  const tekst=[m.head,m.lead,m.text].filter(Boolean).join(" "); if(!tekst) return false;
  if(DRIFT_IKKE.some(l => String(m.head||"").indexOf(l)>-1)) return false;
  const s=tilDato(m.sDate,m.sTime||"00:00:00"), e=tilDato(m.eDate,m.eTime||"23:59:00");
  if(s&&e&&(e-s)>DRIFT_MAKS_DAGE*86400000) return false;
  if(DRIFT_BANE.some(o=>tekst.indexOf(o)>-1)) return true;
  return DRIFT_LINJER.some(o=>tekst.indexOf(o)>-1) && DRIFT_STEDER.some(o=>tekst.indexOf(o)>-1);
}
async function hentVejrNu(){ try{ await hentVejr(); }catch(e){} stat.sidstVejr=Date.now(); byg(); }

/* ─────────────────────────────────────────────────────────
   Afledning: fra lager til rækker.
   Én række per AFGANG, med de veje videre der lander samtidig.
   ───────────────────────────────────────────────────────── */
function afled(nu){
  const rækker = [];
  RUTER.filter(aktiv).forEach(rute => {
    const h = hylde(rute);
    const varsel = hjemad ? rute.varsel : VARSEL_HJEMMEFRA;
    const to_ = Array.from(h.to.values());
    h.et.forEach(a => {
      if(erLåstAfgang(rute, a)) return;          // står i panelet, ikke i listen
      if(a.afgang < nu) return;
      const grænse = new Date(a.ankomst.getTime() + rute.gangtid*60000);
      const mulige = to_.filter(x => !x.aflyst && x.afgang >= grænse);
      if(!mulige.length) return;
      let tidligst = mulige[0].ankomst;
      mulige.forEach(x => { if(x.ankomst < tidligst) tidligst = x.ankomst; });
      const set = {};
      const veje = mulige.filter(x => +x.ankomst === +tidligst).filter(x => {
        const n = x.linje+"|"+(x.videre?x.videre.linje:""); if(set[n]) return false; set[n]=true; return true;
      }).map(b => ({ to:b, vent:minutter(a.ankomst,b.afgang), rummelig:minutter(a.ankomst,b.afgang) >= rute.gangtid+3 }))
        .sort((x,y) => (x.to.videre?0:1) - (y.to.videre?0:1));   // H over Ballerup øverst
      rækker.push({ rute:rute, et:a, veje:veje, ankomst:tidligst, aflyst:a.aflyst,
        knap: minutter(nu, a.afgang) < varsel, samlet: minutter(a.afgang, tidligst),
        nøgle: rute.navn+"|"+benNøgle(a) });
    });
  });

  /* blokke efter ankomst */
  const kasser = {};
  rækker.forEach(r => { const n=+r.ankomst; (kasser[n]=kasser[n]||[]).push(r); });
  return Object.keys(kasser).map(n => {
    const k = kasser[n].sort((a,b) => a.et.afgang - b.et.afgang);
    /* behold den seneste brugbare afgang — og den seneste RUMMELIGE, hvis
       den seneste er stram. Aflyste beholdes altid, de forklarer hullet. */
    const brugbare = k.filter(r => !r.aflyst);
    let vis = [];
    if(brugbare.length){
      const senest = brugbare[brugbare.length-1];
      vis.push(senest);
      if(!senest.veje.some(v => v.rummelig)){
        for(let i=brugbare.length-2;i>=0;i--){ if(brugbare[i].veje.some(v=>v.rummelig)){ vis.unshift(brugbare[i]); break; } }
      }
    }
    return vis.concat(k.filter(r => r.aflyst)).sort((a,b) => a.et.afgang - b.et.afgang);
  }).sort((a,b) => a[0].ankomst - b[0].ankomst).filter(k => k.length);
}

/* ─────────────────────────────────────────────────────────
   Låsen — din rejse hjem, ikke en bestemt afgang
   ───────────────────────────────────────────────────────── */
const LÅS_NØGLE="afgangstavle-lås-b2", LÅS_MARGEN=3;
function læsLås(){ try{ const r=localStorage.getItem(LÅS_NØGLE); lås=r?JSON.parse(r):null; }catch(e){ lås=null; } }
function gemLås(){ try{ if(lås) localStorage.setItem(LÅS_NØGLE,JSON.stringify(lås)); else localStorage.removeItem(LÅS_NØGLE); }catch(e){} }
function sætLås(r, vej){
  lås = { hjemad:hjemad, rute:r.rute.navn, etLinje:r.et.linje, etPlanlagt:+r.et.planlagt,
          toLinje:vej.to.linje, toPlanlagt:+vej.to.planlagt, videreLinje:vej.to.videre?vej.to.videre.linje:"",
          målAnkomst:+vej.to.ankomst };
  gemLås(); vågn(); byg(true); hentAfgange();
}
function slipLås(){ lås=null; gemLås(); vågn(); byg(true); }
function erLåstAfgang(rute, a){
  return !!lås && lås.hjemad===hjemad && lås.rute===rute.navn
      && String(a.linje)===lås.etLinje && +a.planlagt===lås.etPlanlagt;
}

/* finder låsens ben i lageret, og erstatninger hvis noget er aflyst */
function låsData(nu){
  if(!lås || lås.hjemad!==hjemad) return null;
  const rute = RUTER.filter(r => r.navn===lås.rute)[0]; if(!rute) return null;
  const h = hylde(rute);
  const et = Array.from(h.et.values()), to_ = Array.from(h.to.values());
  const a = et.filter(x => String(x.linje)===lås.etLinje && +x.planlagt===lås.etPlanlagt)[0] || null;
  const b = to_.filter(x => String(x.linje)===lås.toLinje && +x.planlagt===lås.toPlanlagt
                         && (x.videre?x.videre.linje:"")===lås.videreLinje)[0] || null;
  let aErstat=null, bErstat=null;
  if(a && a.aflyst){
    et.forEach(x => { if(x.aflyst || x.afgang < a.afgang) return; if(!aErstat || x.afgang < aErstat.afgang) aErstat=x; });
  }
  const brugtA = aErstat || a;
  if(brugtA && (!b || b.aflyst || (a && a.aflyst))){
    const grænse = new Date(brugtA.ankomst.getTime() + rute.gangtid*60000);
    to_.forEach(x => { if(x.aflyst || x.afgang < grænse) return; if(!bErstat || x.ankomst < bErstat.ankomst) bErstat=x; });
    if(bErstat && b && !b.aflyst && !(a && a.aflyst)) bErstat = null;
  }
  return { rute:rute, a:a, b:b, aErstat:aErstat, bErstat:bErstat };
}

/* ─────────────────────────────────────────────────────────
   Bygning og tegning
   ───────────────────────────────────────────────────────── */
let levende = [];
let sidsteSignatur = "";

function byg(tvungen){
  const nu = new Date();
  const kasser = afled(nu);
  const d = låsData(nu);

  /* slip låsen når du er fremme */
  if(lås && lås.hjemad===hjemad){
    const gældende = d && (d.bErstat || d.b);
    const ank = gældende ? +gældende.ankomst : lås.målAnkomst;
    if(nu.getTime() > ank + LÅS_MARGEN*60000){ lås=null; gemLås(); }
  }

  const sig = signatur(kasser, d);
  if(!tvungen && sig === sidsteSignatur){ tegnPuls(); return; }
  sidsteSignatur = sig;
  levende = [];
  tegnVejrNu(); tegnStatus(); tegnLås(d, nu); tegnDrift(); tegnListe(kasser, nu);
  tik();
}
function signatur(kasser, d){
  const dele=[hjemad?"h":"u", visFlere?"f":"", visAlt?"a":"", stat.sidstFejl||"", stat.tomme.join(","),
              stat.sidstHentet?"1":"0"];
  kasser.forEach(k => k.forEach(r => {
    dele.push(r.nøgle+"|"+(+r.et.afgang)+"|"+(+r.ankomst)+"|"+(r.aflyst?"A":"")+(r.knap?"K":"")
      +"|"+r.veje.map(v=>v.to.linje+(v.to.videre?v.to.videre.linje:"")+v.vent).join(","));
  }));
  if(lås) dele.push("L"+lås.etPlanlagt+"|"+lås.toPlanlagt);
  if(d) dele.push("D"+(d.a?+d.a.afgang+"|"+(+d.a.ankomst)+(d.a.aflyst?"A":""):"")+"|"
    +(d.b?+d.b.afgang+"|"+(+d.b.ankomst)+(d.b.aflyst?"A":""):"")+"|"+(d.aErstat?"a":"")+(d.bErstat?"b":""));
  stat.drift.forEach(m => dele.push("M"+(m.head||"")));
  dele.push("V"+Object.keys(vejret).map(k=>vejret[k].nu?vejret[k].nu.grader+vejret[k].nu.kode:"").join(""));
  return dele.join("¦");
}

function tegnVejrNu(){
  const h=$("#vejrnu"); h.textContent="";
  const v=vejret[stedHer()]; if(!v||!v.nu) return;
  const g=el("b","mono"); g.textContent=v.nu.grader+"°";
  h.appendChild(vejrIkon(v.nu.kode,24)); h.appendChild(g);
  h.title=v.navn+", "+vejrOrd(v.nu.kode);
}

function tegnStatus(){
  const h=$("#status"); h.textContent="";
  const linjer=[];
  if(stat.sidstFejl){
    const s=el("div","status "+(stat.sidstHentet?"advarsel":"fejl"));
    s.appendChild(document.createTextNode(stat.sidstHentet
      ? "Kunne ikke hente nyt kl. "+urTekst(new Date(stat.sidstForsøgt))+" — viser det sidst kendte. "
      : "Kunne ikke hente rejser. "));
    const b=el("b"); b.textContent=stat.sidstFejl; s.appendChild(b);
    h.appendChild(s);
  }
  if(stat.tomme.length){
    const s=el("div","status");
    s.textContent="Ingen rejser over "+stat.tomme.join(" eller ")+" lige nu — den linje kører ikke på dette tidspunkt.";
    h.appendChild(s);
  }
  if(stat.sover){
    const s=el("div","status advarsel");
    s.appendChild(document.createTextNode("Tavlen er gået i dvale for at spare på kvoten."));
    const k=el("button"); k.textContent="Væk den"; k.addEventListener("click",()=>{ vågn(); hentAfgange(); });
    s.appendChild(k); h.appendChild(s);
  }
}

function tegnDrift(){
  const h=$("#drift"); h.textContent=""; if(!stat.drift.length) return;
  const boks=el("div","drift");
  stat.drift.forEach(m=>{
    const p=el("p"); const b=el("b"); b.textContent=m.head||"Driftsinformation"; p.appendChild(b);
    let t=(m.lead||m.text||"").trim(); if(t.length>180) t=t.slice(0,177).replace(/\s+\S*$/,"")+"…";
    if(t){ p.appendChild(document.createElement("br")); const s=el("span"); s.textContent=t; p.appendChild(s); }
    boks.appendChild(p);
  });
  h.appendChild(boks);
}

function tegnListe(kasser, nu){
  const h=$("#liste"); h.textContent="";
  if(!kasser.length){
    const p=el("p","tom");
    p.textContent = stat.sidstHentet ? "Ingen rejser lige nu." : "Henter …";
    h.appendChild(p); return;
  }
  kasser.forEach(k => {
    const blok=el("div","blok");
    blok.appendChild(tegnBånd(k));
    k.forEach(r => blok.appendChild(tegnRække(r, nu)));
    h.appendChild(blok);
  });
}
function tegnBånd(k){
  const b=el("div","bånd");
  const e=el("span","etiket"); e.textContent="Fremme";
  const t=el("b","mono"); t.textContent=urTekst(k[0].ankomst);
  const tider=k.map(r=>r.samlet); const kortest=Math.min.apply(null,tider), længst=Math.max.apply(null,tider);
  const n=el("span","antal"); n.textContent = kortest===længst ? varighed(kortest) : kortest+"–"+varighed(længst);
  b.appendChild(e); b.appendChild(t); b.appendChild(n);
  const om = el("span","omfremme mono");
  levende.push(n2 => { om.textContent = k[0].ankomst > n2 ? nedtæl(k[0].ankomst, n2) : "fremme"; });
  b.appendChild(om);
  const v=vejrPå(stedDer(), k[0].ankomst);
  if(v){ const w=el("span","vejrder"); w.appendChild(vejrIkon(v.kode,26));
    const g=el("b","mono"); g.textContent=v.grader+"°"; w.appendChild(g);
    if(v.nedbør>0) w.classList.add("vådt"); b.appendChild(w); }
  return b;
}
function tegnRække(r, nu){
  const rk=el("div","rk");
  if(r.aflyst) rk.classList.add("aflyst");
  if(r.knap && !r.aflyst) rk.classList.add("knap");
  if(stat.ændrede.has(r.nøgle)) rk.classList.add("ændret");
  if(r.et.set && nu - r.et.set > 3*60000) rk.classList.add("gammel");
  if(!r.aflyst) rk.addEventListener("click", () => sætLås(r, r.veje[0]));

  const afg=el("div","afg mono");
  const b=el("b"); b.textContent=urTekst(r.et.afgang); afg.appendChild(b);
  const s=el("span");
  if(r.aflyst){ s.textContent="aflyst"; s.classList.add("aflystmærkat"); }
  else{
    const t=el("span"); s.appendChild(t);
    levende.push(n => {
      t.textContent = nedtæl(r.et.afgang, n);
      const sek = (r.et.afgang - n)/1000;
      rk.classList.toggle("snart", sek > 0 && sek <= 180);
      rk.classList.toggle("nu", sek <= 0);
      t.classList.toggle("presser", sek > 0 && sek <= 120);
    });
    if(r.et.forsinkelse>=1){ const e=el("em"); e.textContent=" +"+r.et.forsinkelse; s.appendChild(e); }
  }
  afg.appendChild(s); rk.appendChild(afg);

  const med=el("div","medlinje"); med.appendChild(mærke(r.et.linje, r.et.art)); rk.appendChild(med);

  const veje=el("div","veje");
  r.veje.forEach(v => {
    const linje=el("div","vej");
    const sk=el("span","skift");
    sk.appendChild(document.createTextNode(r.rute.navn+", "));
    const vent=el("em","vent "+(v.rummelig?"ok":"stram")); vent.textContent=v.vent+" min"; sk.appendChild(vent);
    linje.appendChild(sk);
    const pil=el("span","pil"); pil.textContent="›"; linje.appendChild(pil);
    linje.appendChild(mærke(v.to.linje, v.to.art));
    if(v.to.videre){
      const p2=el("span","pil"); p2.textContent="›"; linje.appendChild(p2);
      linje.appendChild(mærke(v.to.videre.linje, v.to.videre.art));
      const via=el("span","via"); via.textContent="via "+v.to.videre.sted; linje.appendChild(via);
    }
    if(!r.aflyst){
      linje.style.cursor="pointer";
      linje.addEventListener("click", e => { e.stopPropagation(); sætLås(r, v); });
    }
    veje.appendChild(linje);
  });
  rk.appendChild(veje);
  return rk;
}

function tegnLås(d, nu){
  const h=$("#låst"); h.textContent=""; if(!lås) return;
  const boks=el("div","låsboks");
  const top=el("div","låstop");
  const m=el("span","låsmærkat"); m.textContent=lås.hjemad?"Du følger — hjem":"Du følger — ud";
  const slip=el("button","slipknap"); slip.textContent="Slip"; slip.addEventListener("click",slipLås);
  top.appendChild(m); top.appendChild(slip); boks.appendChild(top);

  if(lås.hjemad!==hjemad){ const p=el("p","låstom"); p.textContent="Rejsen går den anden vej. Tryk Vend rejsen for at følge den."; boks.appendChild(p); h.appendChild(boks); return; }
  if(!d || !d.a){ const p=el("p","låstom"); p.textContent=stat.sidstHentet?"Kan ikke finde rejsen i det hentede. Tryk Slip for at fjerne den.":"Henter rejsen …"; boks.appendChild(p); h.appendChild(boks); return; }

  const gangtid=d.rute.gangtid;
  const aAflyst=!!d.a.aflyst, bAflyst=!!(d.b&&d.b.aflyst);
  const a=d.aErstat||d.a, b=d.bErstat||d.b;
  if(aAflyst||bAflyst) boks.classList.add("forstyrret");
  if(!b){ const p=el("p","låstom"); p.textContent="Ingen forbindelse videre lige nu. Tryk Slip for at fjerne rejsen."; boks.appendChild(p); h.appendChild(boks); return; }

  const lokalNavn = lås.hjemad ? d.rute.lokalNavn : HJEM.navn;
  const målNavn   = lås.hjemad ? HJEM.navn : d.rute.lokalNavn;

  function tider(ben){
    const t=el("div","trintider mono");
    t.appendChild(document.createTextNode(urTekst(ben.afgang)));
    if(ben.forsinkelse>=1){ const e=el("em"); e.textContent=" +"+ben.forsinkelse; t.appendChild(e); }
    t.appendChild(document.createTextNode(" – "+urTekst(ben.ankomst)));
    if(ben.ankForsinkelse>=1){ const e=el("em"); e.textContent=" +"+ben.ankForsinkelse; t.appendChild(e); }
    return t;
  }
  function trin(ben, fra, til, statusFn, aflyst){
    const t=el("div","trin"+(aflyst?" trinaflyst":""));
    const mk=el("div"); mk.appendChild(mærke(ben.linje,ben.art)); t.appendChild(mk);
    const midt=el("div"); const r=el("div","trinrute"); r.textContent=fra+" › "+til;
    midt.appendChild(r); midt.appendChild(tider(ben)); t.appendChild(midt);
    const s=el("div","trinstatus mono");
    if(aflyst){ s.textContent="aflyst"; s.classList.add("aflystnu"); }
    else levende.push(n => { const x=statusFn(n); s.textContent=x[0]; s.className="trinstatus mono "+x[1]; });
    t.appendChild(s); return t;
  }
  const status=(fra,til,slut)=>n => n<fra?[nedtæl(fra,n),"venter"]:n<til?["undervejs","kører"]:[slut,"færdig"];
  const erstat=t=>{ const e=el("div","erstattet"); e.textContent=t; return e; };
  function skifte(sted, vent, krav, afgTid){
    const sk=el("div","trinskift");
    const t=el("span"); t.textContent="Skift på "+sted+" · "+vent+" min"; sk.appendChild(t);
    const dom=el("span","skiftdom");
    levende.push(n => {
      const kørt=afgTid<n, stramt=vent<krav;
      if(kørt&&stramt){ dom.textContent="mistet"; dom.className="skiftdom mistet"; }
      else if(kørt){ dom.textContent="overstået"; dom.className="skiftdom færdig"; }
      else if(stramt){ dom.textContent="stramt — skynd dig"; dom.className="skiftdom stramt"; }
      else { dom.textContent="holder"; dom.className="skiftdom holder"; }
    });
    sk.appendChild(dom); return sk;
  }

  if(aAflyst){ boks.appendChild(trin(d.a, lokalNavn, d.rute.navn, null, true)); boks.appendChild(erstat(d.aErstat?"Erstattet af":"Ingen erstatning fundet")); }
  boks.appendChild(trin(a, lokalNavn, d.rute.navn, status(a.afgang,a.ankomst,"ankommet")));
  boks.appendChild(skifte(d.rute.navn, minutter(a.ankomst,b.afgang), gangtid, b.afgang));
  if(bAflyst&&d.b){ boks.appendChild(trin(d.b, d.rute.navn, målNavn, null, true)); boks.appendChild(erstat(d.bErstat?"Erstattet af":"Ingen erstatning fundet")); }

  if(b.videre){
    const v=b.videre;
    boks.appendChild(trin({linje:b.linje,art:b.art,afgang:b.afgang,ankomst:v.fraAnkomst,forsinkelse:b.forsinkelse,ankForsinkelse:0},
      d.rute.navn, v.sted, status(b.afgang,v.fraAnkomst,"fremme")));
    boks.appendChild(skifte(v.sted, minutter(v.fraAnkomst,v.afgang), 1, v.afgang));
    boks.appendChild(trin({linje:v.linje,art:v.art,afgang:v.afgang,ankomst:v.ankomst,forsinkelse:v.forsinkelse,ankForsinkelse:b.ankForsinkelse},
      v.sted, målNavn, status(v.afgang,v.ankomst,"fremme")));
  }else{
    boks.appendChild(trin(b, d.rute.navn, målNavn, status(b.afgang,b.ankomst,"fremme")));
  }

  const fod=el("div","låsfod");
  const fm=el("span","fodmærkat"); fm.textContent="Fremme i "+målNavn;
  const ft=el("b","mono"); ft.textContent=urTekst(b.ankomst);
  fod.appendChild(fm); fod.appendChild(ft);
  const rest=el("span","fodrest mono");
  const skred = lås.målAnkomst ? minutter(new Date(lås.målAnkomst), b.ankomst) : 0;
  if(skred>=1){ rest.textContent=skred+" min senere end da du låste"; rest.classList.add("skredet"); }
  else levende.push(n => { rest.textContent = n<b.ankomst ? nedtæl(b.ankomst,n) : ""; });
  fod.appendChild(rest); boks.appendChild(fod);
  h.appendChild(boks);
}

function tegnPuls(){
  const p=$("#puls");
  const gammel = stat.sidstHentet && (Date.now()-stat.sidstHentet) > 4*60000;
  p.className="puls"+(stat.sover?" sover":(stat.sidstFejl&&!stat.sidstHentet)?" gal":stat.henter?" arbejder":gammel?" gammel":"");
}

/* ─────────────────────────────────────────────────────────
   Tikket — hvert sekund, uanset hentning
   ───────────────────────────────────────────────────────── */
function tik(){
  const nu=new Date(), t=nu.getTime();
  $("#ur").textContent=urTekst(nu);
  $("#dato").textContent=datoTekst(nu);
  $("#titel").textContent=hjemad?"Hjem":"Ud";
  $("#forklar").textContent=hjemad?"Fra Gladsaxe Rådhus til Ølstykke. Sorteret efter hvornår du er fremme."
                                  :"Fra Ølstykke til Gladsaxe Rådhus. Sorteret efter hvornår du er fremme.";
  levende.forEach(f=>{ try{ f(nu); }catch(e){} });

  const alder = stat.sidstHentet ? Math.round((t-stat.sidstHentet)/1000) : null;
  $("#fod").textContent="v"+VERSION+" · "+(alder===null?"henter …":alder<60?"hentet for "+alder+" sek. siden":"hentet "+urTekst(new Date(stat.sidstHentet)))
    +(visFlere?" · viser flere":"")+" · Data fra Rejseplanen";

  const hver=(lås?LÅS_SEKUNDER:HENT_SEKUNDER)*1000;
  const gået=stat.sidstForsøgt?Math.min(1,(t-stat.sidstForsøgt)/hver):0;
  const bar=$("#fremdrift"); bar.style.width=(gået*100).toFixed(1)+"%"; bar.className="fremdrift"+(stat.henter?" arbejder":"");

  const varSover=stat.sover;
  if(!stat.sover && (t-stat.sidsteAktivitet)>DVALE_MINUTTER*60000) stat.sover=true;
  if(stat.sover!==varSover) byg(true);
  tegnPuls();

  /* takten — hver ting sin egen */
  if(!document.hidden && !stat.sover){
    if(t-stat.sidstForsøgt >= hver) hentAfgange();
    if(t-stat.sidstDrift >= DRIFT_MINUTTER*60000) hentDrift();
    if(t-stat.sidstVejr >= VEJR_MINUTTER*60000) hentVejrNu();
  }
  /* hvert minut: rækker der er kørt, skal væk selv uden ny hentning */
  if(nu.getSeconds()===0) byg();
}
function vågn(){ stat.sidsteAktivitet=Date.now(); if(stat.sover){ stat.sover=false; byg(true); } }

$("#knapVend").addEventListener("click",()=>{ hjemad=!hjemad; vågn(); byg(true); hentAfgange(); });
$("#knapOpdater").addEventListener("click",()=>{ vågn(); hentAfgange(); hentDrift(); });
$("#knapFlere").addEventListener("click",e=>{ visFlere=!visFlere; e.currentTarget.setAttribute("aria-pressed",String(visFlere)); vågn(); hentAfgange(); });
$("#knapAlt").addEventListener("click",e=>{ visAlt=!visAlt; e.currentTarget.setAttribute("aria-pressed",String(visAlt)); vågn(); byg(true); hentAfgange(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) vågn(); });
["click","keydown","touchstart"].forEach(n=>document.addEventListener(n,()=>{ stat.sidsteAktivitet=Date.now(); },{passive:true}));

læsLås();
byg(true);
setInterval(tik,1000);
})();
</script>
</body>
</html>
