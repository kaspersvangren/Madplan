/* gangtid = hvor lang tid DU er om skiftet, fra bussen holder ved

                      "Herlev St","Husum St","Ølstykke","Ballerup","Måløv","Skovlunde","Islev"];

/* Vejr hentes fra Open-Meteo. Ingen nøgle, ingen kvote, og det går

  ølstykke: { navn: "Ølstykke",  lat: 55.7956, lon: 12.1597 }

const OPDATER_SEKUNDER = 60;
const LÅS_SEKUNDER     = 30;  // mens du følger en rejse

<style>
:root{
  --luft:#e9edf1; --flade:#fff; --blæk:#0e1620; --dæmpet:#5a6673;
  --hårfin:#d3dae1; --sbus:#ffd400; --letbane:#32ac5c; --stog:#b7202e;
  --forsinket:#a35400; --stram:#8a6a1f; --aflyst:#c1121f; --god:#1f7a44; --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--luft);color:var(--blæk);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:18px 16px 40px;}
.ramme{max-width:880px;margin:0 auto;}

.hoved{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:2px solid var(--blæk);}
.titelblok{display:flex;flex-direction:column;gap:1px;}
.hoved h1{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;
  font-size:29px;letter-spacing:.03em;text-transform:uppercase;margin:0;
  line-height:1.05;}

/* vejret hvor du står lige nu */
/* vejr og ur samlet, så de står på samme midterlinje */
.højre{margin-left:auto;display:flex;align-items:center;gap:14px;}
.vejrnu{display:flex;align-items:center;gap:6px;cursor:default;}
.vejrikon{display:inline-flex;align-items:center;line-height:0;}
.vejrikon svg{display:block;overflow:visible;}
.vejrnu b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:19px;font-weight:600;}
.vejrnu .dryp{font-size:13px;}

.ur{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:22px;
  font-variant-numeric:tabular-nums;}
.dato{color:var(--dæmpet);font-size:13px;}
.puls{width:8px;height:8px;border-radius:50%;background:var(--letbane);
  display:inline-block;vertical-align:middle;margin-right:6px;}
.puls.arbejder{animation:blink 1s ease-in-out infinite;}
.puls.sover{background:var(--dæmpet);}
.puls.gal{background:var(--aflyst);}
@keyframes blink{50%{opacity:.25}}

.knapper{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px;}
button{font-family:inherit;font-size:13px;font-weight:500;background:var(--flade);
  color:var(--blæk);border:1px solid var(--hårfin);border-radius:var(--radius);
  padding:7px 13px;cursor:pointer;}
button:hover{border-color:var(--blæk);}
button[aria-pressed="true"]{background:var(--blæk);color:#fff;border-color:var(--blæk);}
button:focus-visible{outline:2px solid var(--stog);outline-offset:2px;}
#knapVend{font-weight:600;}
.forklar{font-size:12.5px;color:var(--dæmpet);margin:0 0 16px;}

/* ── driftsinformation ─────────────────────────────────── */
.drift{background:var(--flade);border:1px solid var(--hårfin);
  border-left:3px solid var(--forsinket);border-radius:var(--radius);
  padding:11px 14px;margin-bottom:14px;font-size:13.5px;}
.drift p{margin:0;}
.drift p + p{margin-top:7px;padding-top:7px;border-top:1px solid #eef1f4;}
.drift b{font-weight:600;}
.drift span{color:var(--dæmpet);}

/* ── tabellen ──────────────────────────────────────────── */
.kort{background:var(--flade);border:1px solid var(--hårfin);
  border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dæmpet);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--hårfin);
  white-space:nowrap;}
thead th:first-child{padding-left:16px;}
thead th:last-child{padding-right:16px;text-align:right;}

tbody td{padding:11px 10px;border-top:1px solid #eef1f4;vertical-align:middle;}
/* hver gruppe indledes af et bånd med ankomsttiden */
tr.bånd td{
  background:#eaeef2;border-top:1px solid var(--hårfin);
  padding:7px 16px;}
tbody.kasse + tbody.kasse tr.bånd td{border-top:9px solid var(--luft);}
tr.bånd .etiket{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dæmpet);
  margin-right:9px;}
tr.bånd b{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:600;}
tr.bånd .antal{font-size:12px;color:var(--dæmpet);margin-left:9px;}
/* vejret dér hvor du står af */
tr.bånd .vejrder{float:right;display:inline-flex;align-items:center;gap:7px;
  font-size:17px;color:var(--dæmpet);}
tr.bånd .vejrder b{font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;font-weight:600;}
tr.bånd .vejrder.vådt{color:var(--stram);font-weight:600;}
tbody.kasse tr:not(.bånd) + tr td{border-top:1px dotted #e7ecf1;}
tbody.kasse tr.bånd + tr td{border-top:none;}
tr.knap{opacity:.55;}
tr.knap .afg span{color:var(--stram);}
tbody tr:first-child td{border-top:none;}
td:first-child{padding-left:16px;}
td:last-child{padding-right:16px;}

.afg{width:1%;white-space:nowrap;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;}
.afg b{font-size:18px;font-weight:600;display:block;line-height:1.15;}
.afg span{font-size:11.5px;color:var(--dæmpet);}
.afg em{font-style:normal;color:var(--forsinket);font-weight:600;margin-left:4px;}
tr.sen .afg b{color:var(--forsinket);}

.linje{width:1%;white-space:nowrap;}
.mærke{display:inline-block;min-width:46px;text-align:center;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:12.5px;
  padding:2px 6px;border-radius:var(--radius);background:var(--blæk);color:#fff;}
.mærke.bus{background:var(--sbus);color:#1a1a00;}
.mærke.letbane{background:var(--letbane);color:#fff;}
.mærke.stog{background:var(--stog);color:#fff;}

.sted{font-size:13.5px;white-space:nowrap;}
/* togskift undervejs */
.minipil{color:var(--hårfin);margin:0 3px;}
.via{font-size:11.5px;color:var(--dæmpet);margin-left:6px;}
.skift{font-size:13px;color:var(--dæmpet);white-space:nowrap;}
.vent{font-family:"IBM Plex Mono",monospace;font-weight:600;}
.vent.ok{color:var(--god);}
.vent.stram{color:var(--stram);}

@media(max-width:680px){
  thead{display:none;}
  table,tbody{display:block;}
  tbody tr{
    display:grid;
    grid-template-columns:auto auto 1fr auto;
    grid-template-areas:
      "afg  afg  afg   afg"
      "l1   sted skift l2";
    align-items:center;
    gap:5px 8px;
    padding:12px 14px;
    border-top:1px solid #eef1f4;
  }
  tbody tr:first-child{border-top:none;}

  /* tabellens "så smal som muligt" må ikke gælde her — det var den,
     der klemte mærkerne ind over stednavnet */
  td.afg,td.linje,td.sted,td.skift{
    display:block;width:auto;border:none;padding:0;min-width:0;}
  .trin{grid-template-columns:auto 1fr;row-gap:4px;}
  .trinstatus{grid-column:2;text-align:left;}
  tr.bånd{display:block;padding:0;}
  tr.bånd td{display:block;width:auto;padding:7px 14px;}

  td.afg{grid-area:afg;}
  td:nth-child(2){grid-area:l1;}
  td.sted{grid-area:sted;}
  td.skift{grid-area:skift;}
  td:nth-child(5){grid-area:l2;white-space:nowrap;}
  td:nth-child(5) .via{display:none;}
  td.afg b,td.afg span{display:inline;}
  td.afg span{margin-left:8px;}

  td.sted,td.skift{font-size:13px;}
  td.skift::before,td:nth-child(5)::before{
    content:"› ";color:var(--hårfin);}

  td.tom{grid-column:1 / -1;}
}

.tom{padding:20px 16px;font-size:13.5px;color:var(--dæmpet);}
.besked{background:var(--flade);border:1px solid var(--hårfin);
  border-left:3px solid var(--aflyst);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;font-size:14px;}
.besked h3{margin:0 0 5px;font-size:14px;font-weight:600;}
.besked code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  background:#eef1f4;padding:1px 5px;border-radius:2px;}
.rolig{background:var(--flade);border:1px solid var(--hårfin);border-radius:var(--radius);
  padding:10px 14px;margin:0 0 14px;font-size:13px;color:var(--dæmpet);}
/* mens der hentes: listen tones ned, så knapperne kvitterer synligt */
body.henter .kort{opacity:.45;transition:opacity .12s;}
body.henter .knapper button{cursor:progress;}
.kort{transition:opacity .18s;}
.fod{margin-top:20px;font-size:12px;color:var(--dæmpet);white-space:pre-line;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;}}

/* ── den rejse du følger ──────────────────────────────── */
.låsboks{background:var(--flade);border:1px solid var(--blæk);
  border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.låstop{display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;background:var(--blæk);}
.låsmærkat{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;}
.slipknap{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);
  padding:3px 11px;font-size:12px;}
.slipknap:hover{border-color:#fff;background:rgba(255,255,255,.14);}

.trin{display:grid;grid-template-columns:auto 1fr auto;gap:12px;
  align-items:center;padding:11px 16px;border-top:1px solid #eef1f4;}
.trinmærke{display:flex;align-items:center;white-space:nowrap;}
.trinrute{font-size:13.5px;}
.trintider{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:12.5px;color:var(--dæmpet);}
.trintider em{font-style:normal;color:var(--forsinket);font-weight:600;}
.trinstatus{font-size:12px;white-space:nowrap;text-align:right;color:var(--dæmpet);}
.trinstatus.kører{color:var(--god);font-weight:600;}
.trinstatus.færdig{opacity:.55;}

.trinskift{display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;padding:8px 16px;background:#f2f5f8;font-size:13px;
  color:var(--dæmpet);border-top:1px solid #eef1f4;}
.skiftdom{font-weight:600;white-space:nowrap;}
.skiftdom.holder{color:var(--god);}
.skiftdom.stramt{color:var(--stram);}
.skiftdom.mistet{color:var(--aflyst);}
.skiftdom.færdig{color:var(--dæmpet);font-weight:400;}

.låsfod{display:flex;align-items:baseline;gap:10px;padding:11px 16px;
  border-top:1px solid var(--hårfin);}
.fodmærkat{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dæmpet);}
.låsfod b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:21px;font-weight:600;}
.fodrest{font-size:12.5px;color:var(--dæmpet);margin-left:auto;}

.låsalt{margin:0;padding:9px 16px;font-size:13px;color:var(--dæmpet);
  background:#f6f8fa;border-top:1px solid #eef1f4;}

/* noget i den låste rejse er aflyst */
.låsboks.forstyrret{border-color:var(--aflyst);}
.låsboks.forstyrret .låstop{background:var(--aflyst);}
.trin.trinaflyst{opacity:.55;}
.trin.trinaflyst .trinrute,.trin.trinaflyst .trintider{text-decoration:line-through;}
.trinstatus.aflystnu{color:var(--aflyst);font-weight:600;text-decoration:none;}
.erstattet{padding:5px 16px;font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--aflyst);background:#fdf3f3;border-top:1px solid #f6e2e2;}
.fodrest.skredet{color:var(--aflyst);font-weight:600;}
.låstom{margin:0;padding:14px 16px;font-size:13.5px;color:var(--dæmpet);}
tr.erlåst{display:none;}
/* aflyst afgang — vises, men kan ikke bruges */
tbody tr.aflyst td{opacity:.5;}
tbody tr.aflyst .afg b,tbody tr.aflyst .sted,tbody tr.aflyst .skift{
  text-decoration:line-through;}
.aflystmærkat{color:var(--aflyst);font-weight:600;
  text-decoration:none;display:inline-block;}
/* den tidligere afgang der giver luft ved et stramt skifte */
.afg em.luft{font-style:normal;color:var(--god);font-weight:600;margin-left:5px;}
tr.valgbar{cursor:pointer;}
tr.valgbar:hover td{background:#f4f7fa;}

</style>
</head>
<body>
<div class="ramme">
  <header class="hoved">
    <div class="titelblok">
      <h1 id="titel">Hjem</h1>

    <div class="højre">
      <span class="vejrnu" id="vejrnu"></span>
      <span class="ur"><span class="puls" id="puls"></span><span id="ur">--:--</span></span>
    </div>
  </header>

  <div class="knapper">
    <button id="knapVend">Vend rejsen</button>
    <button id="knapOpdater">Opdater nu</button>
    <button id="knapFlere" aria-pressed="false">Flere rejser</button>
    <button id="knapAlt" aria-pressed="false">Vis 166</button>
  </div>
  <p class="forklar" id="forklar"></p>

  <div id="drift"></div>
  <div id="låst"></div>
  <div id="beskeder"></div>

  <div class="kort">
    <table id="tabel">
      <thead>
        <tr>
          <th>Afgang</th><th>Med</th><th>Fra</th><th>Skift</th><th>Videre</th>
        </tr>
      </thead>
    </table>
  </div>

  <p class="fod" id="fod">Henter …</p>
</div>

<script>
(function(){
"use strict";
const $  = s => document.querySelector(s);
const el = (t,k) => { const n=document.createElement(t); if(k) n.className=k; return n; };

let hjemad=true, visFlere=false, visAlt=false, sover=false, timer=null, sidsteAktivitet=Date.now();

const to = n => String(n).padStart(2,"0");
const urTekst = d => to(d.getHours())+":"+to(d.getMinutes());
function datoTekst(d){
  const uge=["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
  const mdr=["jan.","feb.","mar.","apr.","maj","jun.","jul.","aug.","sep.","okt.","nov.","dec."];
  return uge[d.getDay()]+" "+d.getDate()+". "+mdr[d.getMonth()];
}
function idag(){ const d=new Date(); return d.getFullYear()+"-"+to(d.getMonth()+1)+"-"+to(d.getDate()); }
function tilDato(dato,tid){
  if(!dato||!tid) return null;
  const d=dato.split("-").map(Number), t=tid.split(":").map(Number);
  return new Date(d[0],d[1]-1,d[2],t[0],t[1],t[2]||0);
}
const minutter=(a,b)=>Math.round((b-a)/60000);
const varighedTekst = m => m>=60 ? Math.floor(m/60)+" t "+(m%60)+" m" : m+" min";

/* ── vejr ──────────────────────────────────────────────── */
/* Open-Meteos vejrkoder, samlet i de grupper der giver mening at
   se forskel på, når man skal beslutte sig for en jakke.          */
/* Ikonerne tegnes her i stedet for at bruge skrifttegn — de indbyggede
   symboler er sorte og signalerer ingenting. Farverne: sol ravgul,
   skyer gråblå, regn blå, sne lys blå, lyn ravgul.                  */
const SOL = "#e0a132", SKY = "#93a2b0", REGN = "#3d7ab8", SNE = "#79aed4";

function svgSol(x,y,r){
  let ud = '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+SOL+'"/>';
  const stråler = [[0,-1],[0,1],[-1,0],[1,0],[-.71,-.71],[.71,.71],[-.71,.71],[.71,-.71]];
  ud += '<g stroke="'+SOL+'" stroke-width="1.6" stroke-linecap="round">';
  stråler.forEach(d => {
    ud += '<line x1="'+(x+d[0]*(r+1.8)).toFixed(1)+'" y1="'+(y+d[1]*(r+1.8)).toFixed(1)
        + '" x2="'+(x+d[0]*(r+3.9)).toFixed(1)+'" y2="'+(y+d[1]*(r+3.9)).toFixed(1)+'"/>';
  });
  return ud + '</g>';
}
const SKYFORM = '<path d="M7.2 18h9.3a3.9 3.9 0 0 0 .4-7.8 5.4 5.4 0 0 0-10.3 1.6A3.3 3.3 0 0 0 7.2 18z"';

function dråber(farve, antal, y){
  let ud = '<g stroke="'+farve+'" stroke-width="1.9" stroke-linecap="round">';
  const x = antal === 2 ? [9.5,14.5] : [8,12,16];
  x.forEach(px => { ud += '<line x1="'+px+'" y1="'+y+'" x2="'+(px-1.2)+'" y2="'+(y+3.6)+'"/>'; });
  return ud + '</g>';
}
function fnug(){
  let ud = '<g fill="'+SNE+'">';
  [[8.5,21],[12,22.2],[15.5,21]].forEach(pt => {
    ud += '<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="1.15"/>';
  });
  return ud + '</g>';
}

function vejrTegning(kode){
  if(kode === 0) return svgSol(12,12,5.2);
  if(kode === 1 || kode === 2)
    return svgSol(8.5,8.5,3.6) + SKYFORM + ' fill="'+SKY+'"/>';
  if(kode === 3) return SKYFORM + ' fill="'+SKY+'"/>';
  if(kode === 45 || kode === 48)
    return SKYFORM + ' fill="'+SKY+'" opacity=".75"/>'
      + '<g stroke="'+SKY+'" stroke-width="1.7" stroke-linecap="round">'
      + '<line x1="6" y1="20.5" x2="18" y2="20.5"/>'
      + '<line x1="8" y1="23" x2="16" y2="23"/></g>';
  if(kode >= 51 && kode <= 57)
    return SKYFORM + ' fill="'+SKY+'"/>' + dråber(REGN,2,19.5);
  if((kode >= 61 && kode <= 67) || (kode >= 80 && kode <= 82))
    return SKYFORM + ' fill="'+SKY+'"/>' + dråber(REGN,3,19.5);
  if((kode >= 71 && kode <= 77) || (kode >= 85 && kode <= 86))
    return SKYFORM + ' fill="'+SKY+'"/>' + fnug();
  if(kode >= 95)
    return SKYFORM + ' fill="'+SKY+'"/>'
      + '<polygon points="12.8,18.6 9.2,23.4 11.6,23.4 10.4,27 14.6,21.6 12,21.6"'
      + ' fill="'+SOL+'"/>';
  return '<circle cx="12" cy="12" r="3" fill="'+SKY+'"/>';
}

/* returnerer et færdigt ikon i den ønskede størrelse */
function vejrIkon(kode, px){
  const span = el("span","vejrikon");
  span.style.width = px+"px";
  span.style.height = px+"px";
  span.innerHTML = '<svg viewBox="0 0 24 28" width="'+px+'" height="'+px
    + '" aria-hidden="true" focusable="false">' + vejrTegning(kode) + '</svg>';
  return span;
}
function vejrOrd(kode){
  if(kode === 0)                    return "klart";
  if(kode === 1 || kode === 2)      return "let skyet";
  if(kode === 3)                    return "overskyet";
  if(kode === 45 || kode === 48)    return "tåge";
  if(kode >= 51 && kode <= 57)      return "finregn";
  if(kode >= 61 && kode <= 67)      return "regn";
  if(kode >= 71 && kode <= 77)      return "sne";
  if(kode >= 80 && kode <= 82)      return "byger";
  if(kode >= 85 && kode <= 86)      return "snebyger";
  if(kode >= 95)                    return "tordenvejr";
  return "";
}

let vejret = {};   // sted → { nu:{...}, timer:[{tid,kode,grader,nedbør}] }

async function hentVejr(){
  const nøgler = Object.keys(VEJRSTEDER);
  const svar = await Promise.all(nøgler.map(async n => {
    const s = VEJRSTEDER[n];
    const u = "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + s.lat + "&longitude=" + s.lon
      + "&current=temperature_2m,weather_code,precipitation"
      + "&hourly=temperature_2m,weather_code,precipitation"
      + "&timezone=Europe%2FCopenhagen&forecast_days=2";
    try{
      const r = await fetch(u);
      const d = await r.json();
      const t = (d.hourly && d.hourly.time) || [];
      return { navn: s.navn,
        nu: d.current ? { kode: d.current.weather_code,
                          grader: Math.round(d.current.temperature_2m),
                          nedbør: d.current.precipitation } : null,
        timer: t.map((tid,i) => ({
          tid: tid,
          kode: d.hourly.weather_code[i],
          grader: Math.round(d.hourly.temperature_2m[i]),
          nedbør: d.hourly.precipitation[i]
        })) };
    }catch(e){ return null; }
  }));
  const ud = {};
  nøgler.forEach((n,i) => { if(svar[i]) ud[n] = svar[i]; });
  vejret = ud;
}

/* find den time et tidspunkt falder i */
function vejrPå(stedNøgle, tid){
  const v = vejret[stedNøgle];
  if(!v || !v.timer.length) return null;
  const mærke = tid.getFullYear()+"-"+to(tid.getMonth()+1)+"-"+to(tid.getDate())
              + "T" + to(tid.getHours()) + ":00";
  for(let i=0;i<v.timer.length;i++){ if(v.timer[i].tid === mærke) return v.timer[i]; }
  return null;
}

/* hvor du står nu, og hvor du lander */
function stedHer(){ return hjemad ? "gladsaxe" : "ølstykke"; }
function stedDer(){ return hjemad ? "ølstykke" : "gladsaxe"; }

/* ── hentning ──────────────────────────────────────────── */
const kurv = {};
async function kald(url){
  const svar = await fetch(url);
  const data = await svar.json().catch(()=>null);
  if(!data) throw new Error("Uforståeligt svar fra Rejseplanen.");
  if(data.errorCode) throw new Error(data.errorText||data.errorCode);
  return data;
}
function bygBen(fra,til,produkter,sammenhæng,skift,tid){
  let u = FUNKTION + "?sti=trip"
    + "&rtMode=REALTIME"
    + "&originId=" + encodeURIComponent(fra)
    + "&destId="   + encodeURIComponent(til)
    + "&products=" + produkter + "&maxChange=" + (skift||0) + "&numF=" + PER_SØGNING;
  if(tid){
    u += "&date=" + tid.getFullYear() + "-" + to(tid.getMonth()+1) + "-" + to(tid.getDate())
       + "&time=" + to(tid.getHours()) + ":" + to(tid.getMinutes());
  }
  if(sammenhæng) u += "&context=" + encodeURIComponent(sammenhæng);
  return u;
}
async function hentBen(fra,til,produkter,sider,skift,tid){
  const n = fra+"|"+til+"|"+produkter+"|"+sider+"|"+(skift||0)+"|"+(tid?+tid:0);
  if(kurv[n]) return kurv[n];
  kurv[n] = (async () => {
    const f = await kald(bygBen(fra,til,produkter,null,skift,tid));
    let ture = Array.isArray(f.Trip)?f.Trip.slice():(f.Trip?[f.Trip]:[]);
    let s = f.scrF;
    for(let i=1;i<sider && s;i++){
      try{
        const x = await kald(bygBen(fra,til,produkter,s,skift,tid));
        ture = ture.concat(Array.isArray(x.Trip)?x.Trip:(x.Trip?[x.Trip]:[]));
        s = x.scrF;
      }catch(e){ break; }
    }
    return ture.map(tolkBen).filter(Boolean);
  })();
  return kurv[n];
}

/* ── tolkning ──────────────────────────────────────────── */
function artAf(p){
  const k=((p&&(p.catOutL||p.catOut))||"").toLowerCase();
  if(k.indexOf("letbane")>-1) return "letbane";
  if(k.indexOf("tog")>-1) return "stog";
  return "bus";
}
const produktAf = b => Array.isArray(b.Product)?(b.Product[0]||{}):(b.Product||{});
const tidAf = (p,rt) => rt ? tilDato(p.rtDate||p.date,p.rtTime||p.time) : tilDato(p.date,p.time);

/* Aflysninger står IKKE i ét felt. Rejseplanen sætter dem tre steder:
   på selve benet, på Origin (cancelledDeparture) og på Destination
   (cancelledArrival) — og desuden som en note med nøglen
   text.realtime.journey.cancelled. Vi kigger alle steder, for
   overser man dem, viser tavlen aflyste tog som brugbare.          */
function erAflyst(objekt){
  if(!objekt) return false;
  if(objekt.cancelled === true || objekt.cancelled === "true") return true;
  if(objekt.cancelledDeparture === true || objekt.cancelledArrival === true) return true;
  const n = objekt.Notes && objekt.Notes.Note;
  const noter = Array.isArray(n) ? n : (n ? [n] : []);
  return noter.some(x => x && (x.cancelled === true || x.cancelled === "true"
    || String(x.key||"").indexOf("cancelled") > -1));
}
function benAflyst(b){
  return erAflyst(b) || erAflyst(b.Origin) || erAflyst(b.Destination);
}

function tolkBen(trip){
  const alle=(trip.LegList&&trip.LegList.Leg)||[];
  const ben=(Array.isArray(alle)?alle:[alle]).filter(b => b.type!=="WALK" && b.Product);
  if(ben.length < 1 || ben.length > 2) return null;
  const b=ben[0], p=produktAf(b), sidsteBen=ben[ben.length-1];

  /* Tiderne måles på selve bussen eller toget: hvornår den kører fra
     stoppestedet, og hvornår den er fremme ved stoppestedet i den
     anden ende. Ikke rejsens tider — de indeholder gangstykket,
     og gangtiden er noget DU sætter nedenfor.                     */
  const planlagt=tidAf(b.Origin,false);
  const afgang  =tidAf(b.Origin,true) || planlagt;
  const ankomst =tidAf(sidsteBen.Destination,true) || tidAf(sidsteBen.Destination,false);
  if(!afgang||!ankomst) return null;
  /* to ben betyder et skift undervejs — typisk H til Ballerup og
     videre med C. Det er ofte mere plads, selv om tiden er den samme. */
  const aflyst = erAflyst(trip) || ben.some(benAflyst);

  let videre = null;
  if(ben.length === 2 && !aflyst){
    const p2 = produktAf(ben[1]);
    const ank1 = tidAf(ben[0].Destination,true) || tidAf(ben[0].Destination,false);
    const afg2 = tidAf(ben[1].Origin,true)      || tidAf(ben[1].Origin,false);
    videre = {
      linje: p2.line || (ben[1].name||"").replace(/^(Bus|S-tog|Letbane)\s+/i,"").trim(),
      art: artAf(p2),
      sted: (ben[0].Destination.name||"").replace(/\s+St\.$/,"").trim(),
      vent: (ank1 && afg2) ? minutter(ank1, afg2) : null
    };
  }
  return {
    linje: p.line || (b.name||"").replace(/^(Bus|S-tog|Letbane)\s+/i,"").trim(),
    art: artAf(p), planlagt: planlagt, afgang: afgang, ankomst: ankomst,
    forsinkelse: minutter(planlagt,afgang),
    aflyst: aflyst,
    videre: videre
  };
}

/* Rejseplanen foreslår aldrig H over Ballerup, fordi den aldrig er
   HURTIGERE — kun lige så hurtig. Så vi spørger ikke om et forslag.
   Vi henter Herlev→Ballerup og Ballerup→Ølstykke hver for sig og
   syr dem sammen selv. Det er samme kneb som med bus og tog.       */
let omvejSpor = "";   // hvad omvejen fandt, vises nederst

async function hentOmvej(fraId, sider, bagud){
  const et  = await hentBen(fraId,        BALLERUP_ST, S_TOG, sider, 0, bagud);
  const to_ = await hentBen(BALLERUP_ST,  HJEM.id,     S_TOG, sider, 0, bagud);
  const linjer = {};
  et.forEach(a => { const l = a.linje || "?"; linjer[l] = (linjer[l]||0)+1; });
  const oversigt = Object.keys(linjer).map(l => l+"×"+linjer[l]).join(" ");
  const ud = [];
  let manglerTog = 0, antalH = 0;
  et.forEach(a => {
    if(a.aflyst || !a.linje) return;
    if(String(a.linje).toUpperCase() !== "H") return;   // kun H-vejen
    antalH++;
    const grænse = new Date(a.ankomst.getTime() + SKIFT_BALLERUP*60000);
    let b = null;
    for(let i=0;i<to_.length;i++){
      if(!to_[i].aflyst && to_[i].afgang >= grænse){ b = to_[i]; break; }
    }
    if(!b){ manglerTog++; return; }
    ud.push({
      linje: a.linje, art: a.art,
      planlagt: a.planlagt, afgang: a.afgang, ankomst: b.ankomst,
      forsinkelse: a.forsinkelse, aflyst: false,
      /* C'ets egne tider gemmes, så panelet kan vise det som sit eget
         trin med sin egen forsinkelse — ikke kun som et ekstra mærke. */
      videre: { linje: b.linje, art: b.art, sted: "Ballerup",
                vent: minutter(a.ankomst, b.afgang),
                planlagt: b.planlagt, afgang: b.afgang, ankomst: b.ankomst,
                forsinkelse: b.forsinkelse,
                fraAnkomst: a.ankomst }
    });
  });
  omvejSpor = "Herlev→Ballerup: " + (oversigt || "intet")
            + " · Ballerup→Ølstykke: " + to_.length
            + " · H fundet: " + antalH
            + (manglerTog ? " · uden tog videre: " + manglerTog : "")
            + " · kæder: " + ud.length;
  return ud;
}

/* ── låsen ────────────────────────────────────────────────
   Når du har valgt en rejse og trykket på den, gemmes den her og
   følges undervejs. Den overlever at vinduet lukkes, fordi den
   ligger i browserens eget lager.                                */
const LÅS_NØGLE = "afgangstavle-lås";
const LÅS_MARGEN = 3;      // minutter efter forventet ankomst, så slippes den
let lås = null, låsData = null;

function læsLås(){
  try{
    const r = window.localStorage.getItem(LÅS_NØGLE);
    lås = r ? JSON.parse(r) : null;
  }catch(e){ lås = null; }
}
function gemLås(){
  try{
    if(lås) window.localStorage.setItem(LÅS_NØGLE, JSON.stringify(lås));
    else window.localStorage.removeItem(LÅS_NØGLE);
  }catch(e){ /* uden lager virker låsen bare ikke på tværs af vinduer */ }
}
function sætLås(r){
  lås = {
    hjemad: hjemad,
    rute: r.rute.skiftNavn,
    etLinje: r.et.linje,
    etPlanlagt: +r.et.planlagt,
    toLinje: r.to.linje,
    toPlanlagt: +r.to.planlagt,
    videreLinje: r.to.videre ? r.to.videre.linje : "",
    ankomst: +r.ankomst,
    /* Det du oprindeligt sigtede efter. Bruges til at sige, hvor meget
       en erstatning koster i forhold til det du låste.              */
    målAnkomst: +r.ankomst,
    målAfgang: +r.et.planlagt
  };
  gemLås(); start(); opdater();
}
function slipLås(){ lås = null; gemLås(); start(); opdater(); }

function erLåstAfgang(a){
  return !!lås && lås.hjemad === hjemad
      && String(a.linje) === lås.etLinje && +a.planlagt === lås.etPlanlagt;
}
function erLåstRække(r){
  return !!lås && lås.hjemad === hjemad
      && +r.et.planlagt === lås.etPlanlagt
      && String(r.to.linje) === lås.toLinje
      && (r.to.videre ? r.to.videre.linje : "") === lås.videreLinje;
}

/* ── sammenkobling ─────────────────────────────────────── */
function kobl(rute, et, to_, nu, varsel){
  const ud=[];
  et.forEach(a => {
    if(a.afgang < nu) return;                          // den er kørt
    if(rute.linjer && !rute.linjer.some(l =>
        String(a.linje).toUpperCase() === l.toUpperCase())) return;

    /* En aflyst afgang kobles stadig — på de planlagte tider — så den
       kan vises overstreget dér hvor den ville have hørt hjemme. Så
       forstår du hullet i stedet for bare at se det.                */
    const grænse = new Date(a.ankomst.getTime() + rute.gangtid*60000);
    const mulige = to_.filter(x => !x.aflyst && x.afgang >= grænse);
    if(!mulige.length) return;

    /* Vælg efter tidligste ANKOMST, ikke tidligste afgang — ellers
       vinder et tog der kører først, men er længere om det. Og behold
       ALLE veje der lander samtidig, så du kan vælge den med plads:
       et H til Ballerup og videre med C ankommer som regel samtidig
       med det direkte C, men er mindre stuvet.                       */
    let tidligst = mulige[0].ankomst;
    mulige.forEach(x => { if(x.ankomst < tidligst) tidligst = x.ankomst; });

    const set = {};
    mulige.filter(x => +x.ankomst === +tidligst).forEach(b => {
      const mærke = b.linje + "|" + (b.videre ? b.videre.linje : "") + "|" + (+b.afgang);
      if(set[mærke]) return;
      set[mærke] = true;
      const vent = minutter(a.ankomst, b.afgang);
      ud.push({
        et:a, to:b, rute:rute, vent:vent,
        aflyst: a.aflyst,
        rummelig: vent >= rute.gangtid + 3,
        knap: minutter(nu, a.afgang) < varsel,         // næppe til at nå hjemmefra
        afgang:a.afgang, planlagt:a.planlagt, forsinkelse:a.forsinkelse,
        ankomst:b.ankomst, samlet:minutter(a.afgang,b.ankomst)
      });
    });
  });
  return ud;
}

/* Rejser der lander i Ølstykke på samme tid hører sammen. De vises
   som én blok med ankomsten skrevet én gang — så kan du se alle dine
   muligheder for at nå netop det tog, og vælge den første der kører. */
function grupper(liste){
  const set = {}, rene = [];
  liste.forEach(r => {
    /* togdelen SKAL med i mærket — ellers ser et direkte C og en
       H over Ballerup ens ud, og den ene kasseres som dublet. */
    const n = r.et.linje+"|"+r.afgang.getTime()+"|"+r.ankomst.getTime()
            + "|"+r.to.linje+"|"+(r.to.videre ? r.to.videre.linje : "");
    if(set[n]) return;
    set[n] = true; rene.push(r);
  });
  const kasser = {};
  rene.forEach(r => {
    const n = r.ankomst.getTime();
    (kasser[n] = kasser[n] || []).push(r);
  });

  /* Inden for en blok: behold den SENESTE afgang for hver kombination
     af linjer — tre letbaner op til samme tog er ren ventetid.
     MEN: er den seneste stram, beholdes også den seneste RUMMELIGE.
     Ved fire minutters skifte vælter den mindste forsinkelse dig, og
     så vil du gerne se den afgang der giver luft.
     Aflyste afgange beholdes altid — de forklarer hullet.          */
  Object.keys(kasser).forEach(n => {
    const senest = {}, senestRummelig = {}, aflyste = [];
    kasser[n].forEach(r => {
      if(r.aflyst){ aflyste.push(r); return; }
      const form = r.et.linje + "|" + r.to.linje + "|"
                 + (r.to.videre ? r.to.videre.linje : "");
      if(!senest[form] || r.afgang > senest[form].afgang) senest[form] = r;
      if(r.rummelig && (!senestRummelig[form]
          || r.afgang > senestRummelig[form].afgang)) senestRummelig[form] = r;
    });
    const ud = [];
    Object.keys(senest).forEach(form => {
      ud.push(senest[form]);
      const trygt = senestRummelig[form];
      if(!senest[form].rummelig && trygt && trygt !== senest[form]){
        trygt.medLuft = true;      // vises som det sikre alternativ
        ud.push(trygt);
      }
    });
    kasser[n] = ud.concat(aflyste);
  });
  return Object.keys(kasser)
    .map(k => kasser[k].sort((a,b) => {
      /* aflyste nederst, H over Ballerup øverst blandt de brugbare */
      const aa = a.aflyst ? 1 : 0, ba = b.aflyst ? 1 : 0;
      if(aa !== ba) return aa - ba;
      const ah = a.to.videre ? 0 : 1, bh = b.to.videre ? 0 : 1;
      return (ah - bh) || (a.afgang - b.afgang);
    }))
    .sort((a,b) => a[0].ankomst - b[0].ankomst);
}

/* ── driftsinformation ─────────────────────────────────── */
async function hentDrift(){
  try{
    const data = await kald(FUNKTION + "?sti=himsearch");
    const rå = data.Message;
    const liste = Array.isArray(rå) ? rå : (rå ? [rå] : []);
    return liste.filter(vedkommer).slice(0,3);
  }catch(e){ return []; }
}

function vedkommer(m){
  const tekst = [m.head, m.lead, m.text].filter(Boolean).join(" ");
  if(!tekst) return false;

  /* for langvarigt til at være drift — det er vejarbejde */
  const start = tilDato(m.sDate, m.sTime || "00:00:00");
  const slut  = tilDato(m.eDate, m.eTime || "23:59:00");
  if(start && slut && (slut - start) > DRIFT_MAKS_DAGE*86400000) return false;

  if(DRIFT_BANE.some(o => tekst.indexOf(o) > -1)) return true;

  const linje = DRIFT_LINJER.some(o => tekst.indexOf(o) > -1);
  const sted  = DRIFT_STEDER.some(o => tekst.indexOf(o) > -1);
  return linje && sted;
}
function tegnDrift(beskeder){
  const holder = $("#drift");
  holder.textContent = "";
  if(!beskeder.length) return;
  const boks = el("div","drift");
  beskeder.forEach(m => {
    const p = el("p");
    const b = el("b"); b.textContent = m.head || "Driftsinformation";
    p.appendChild(b);
    let t = (m.lead || m.text || "").trim();
    if(t.length > 180) t = t.slice(0,177).replace(/\s+\S*$/,"") + "…";
    if(t){
      p.appendChild(document.createElement("br"));
      const s = el("span"); s.textContent = t;
      p.appendChild(s);
    }
    boks.appendChild(p);
  });
  holder.appendChild(boks);
}

/* ── tegning ───────────────────────────────────────────── */
function mærke(t,a){ const m=el("span","mærke "+a); m.textContent=t; return m; }

function tegnRække(r, nu, ulåselig){
  const tr = el("tr");
  if(erLåstRække(r)) tr.classList.add("erlåst");
  if(r.aflyst) tr.classList.add("aflyst");
  if(r.medLuft) tr.classList.add("medluft");
  if(!ulåselig && !r.aflyst){
    tr.classList.add("valgbar");
    tr.title = "Tryk for at følge denne rejse";
    tr.addEventListener("click", () => sætLås(r));
  }
  if(r.forsinkelse >= 1) tr.classList.add("sen");
  if(r.knap) tr.classList.add("knap");

  const t1 = el("td","afg");
  const b1 = el("b"); b1.textContent = urTekst(r.afgang);
  const s1 = el("span");
  if(r.aflyst){
    s1.textContent = "aflyst";
    s1.classList.add("aflystmærkat");
  }else{
    const m = minutter(nu, r.afgang);
    s1.textContent = m <= 0 ? "nu" : "om "+m+" min";
    if(r.forsinkelse >= 1){
      const e = el("em"); e.textContent = "+"+r.forsinkelse;
      s1.appendChild(e);
    }
    if(r.medLuft){
      const l = el("em","luft"); l.textContent = "god tid";
      s1.appendChild(l);
    }
  }
  t1.appendChild(b1); t1.appendChild(s1);
  tr.appendChild(t1);

  const t2 = el("td","linje"); t2.appendChild(mærke(r.et.linje, r.et.art));
  tr.appendChild(t2);

  const t3 = el("td","sted");
  t3.textContent = hjemad ? r.rute.lokalNavn : HJEM.navn;
  tr.appendChild(t3);

  const t4 = el("td","skift");
  t4.appendChild(document.createTextNode(r.rute.skiftNavn+", "));
  const v = el("em","vent "+(r.rummelig?"ok":"stram"));
  v.textContent = r.vent+" min";
  t4.appendChild(v);
  tr.appendChild(t4);

  const t5 = el("td","linje");
  t5.appendChild(mærke(r.to.linje, r.to.art));
  if(r.to.videre){
    /* togskift undervejs — typisk H til Ballerup og videre med C */
    const pil = el("span","minipil"); pil.textContent = "›";
    t5.appendChild(pil);
    t5.appendChild(mærke(r.to.videre.linje, r.to.videre.art));
    const v = el("span","via");
    v.textContent = "via " + r.to.videre.sted;
    t5.appendChild(v);
    t5.title = "Skift på " + r.to.videre.sted
      + (r.to.videre.vent !== null ? ", " + r.to.videre.vent + " min" : "")
      + " — som regel mere plads";
  }
  tr.appendChild(t5);



  return tr;
}

/* Låsens egen hentning. Den søger fra et kvarter FØR din afgang, så
   både letbanen og toget stadig kan findes efter de er kørt — og den
   rører ikke den almindelige liste.                                */
async function hentLåsData(){
  if(!lås) return null;
  const rute = RUTER.filter(r => r.skiftNavn === lås.rute)[0];
  if(!rute) return null;

  const af = rute.skiftAf || rute.skiftId;
  const på = rute.skiftPå || rute.skiftId;
  const bagud = new Date(lås.etPlanlagt - 15*60000);

  let et, to_;
  if(lås.hjemad){
    et  = await hentBen(rute.lokalId, af,      rute.produkter, 2, 0, bagud);
    to_ = await hentBen(på,           HJEM.id, S_TOG,          3, 0, bagud);
    if(lås.videreLinje){
      try{ to_ = to_.concat(await hentOmvej(på, 3, bagud)); }catch(e){}
    }
  }else{
    et  = await hentBen(HJEM.id, på,           S_TOG,          2, 0, bagud);
    to_ = await hentBen(af,      rute.lokalId, rute.produkter, 3, 0, bagud);
  }

  const a = et.filter(x => String(x.linje) === lås.etLinje
                        && +x.planlagt === lås.etPlanlagt)[0] || null;
  const b = to_.filter(x => String(x.linje) === lås.toLinje
                        && +x.planlagt === lås.toPlanlagt
                        && (x.videre ? x.videre.linje : "") === lås.videreLinje)[0] || null;

  /* Er dit ben aflyst, findes erstatningen her — den næste afgang du
     kan bruge. Den oprindelige bliver stående som overstreget, så du
     kan se HVAD der skete, ikke bare at tallene ændrede sig.       */
  let aErstat = null, bErstat = null;

  if(a && a.aflyst){
    et.forEach(x => {
      if(x.aflyst || x.afgang < a.afgang) return;
      if(!aErstat || x.afgang < aErstat.afgang) aErstat = x;
    });
  }
  const brugtA = aErstat || a;
  if(brugtA && (!b || b.aflyst || (a && a.aflyst))){
    const grænse = new Date(brugtA.ankomst.getTime() + rute.gangtid*60000);
    to_.forEach(x => {
      if(x.aflyst || x.afgang < grænse) return;
      if(!bErstat || x.ankomst < bErstat.ankomst) bErstat = x;
    });
    if(bErstat && b && !b.aflyst && !(a && a.aflyst)) bErstat = null;
  }
  return { rute: rute, a: a, b: b, aErstat: aErstat, bErstat: bErstat, to_: to_ };
}

function tegnLås(nu){
  const holder = $("#låst");
  holder.textContent = "";
  if(!lås) return;

  const boks = el("div","låsboks");
  const top = el("div","låstop");
  const mærkat = el("span","låsmærkat");
  mærkat.textContent = lås.hjemad ? "Du følger — hjem" : "Du følger — ud";
  const slip = el("button","slipknap"); slip.textContent = "Slip";
  slip.addEventListener("click", slipLås);
  top.appendChild(mærkat); top.appendChild(slip);
  boks.appendChild(top);

  if(lås.hjemad !== hjemad){
    const p = el("p","låstom");
    p.textContent = "Rejsen går den anden vej. Tryk Vend rejsen for at følge den.";
    boks.appendChild(p); holder.appendChild(boks); return;
  }
  if(!låsData || !låsData.a){
    const p = el("p","låstom");
    p.textContent = "Kan ikke finde rejsen lige nu. Tryk Slip for at fjerne den.";
    boks.appendChild(p); holder.appendChild(boks); return;
  }

  const gangtid = låsData.rute.gangtid;
  const aAflyst = låsData.a.aflyst;
  const bAflyst = !låsData.b || låsData.b.aflyst;
  const a = låsData.aErstat || låsData.a;
  const b = låsData.bErstat || låsData.b;

  if(aAflyst || bAflyst) boks.classList.add("forstyrret");

  if(!b){
    const p = el("p","låstom");
    p.textContent = "Der er ingen forbindelse videre lige nu. Tryk Slip for at fjerne rejsen.";
    boks.appendChild(p); holder.appendChild(boks); return;
  }
  const vent = minutter(a.ankomst, b.afgang);
  const stramt = vent < gangtid;
  const togKørt = b.afgang < nu;

  /* ── trin: et ben med sted, tider og tilstand ── */
  function trin(ben, fraNavn, tilNavn, tilstand, klasse, aflyst){
    const t = el("div","trin" + (aflyst ? " trinaflyst" : ""));
    const m = el("div","trinmærke");
    m.appendChild(mærke(ben.linje, ben.art));
    t.appendChild(m);

    const midt = el("div","trinmidt");
    const rute = el("div","trinrute");
    rute.textContent = fraNavn + " › " + tilNavn;
    const tider = el("div","trintider");
    tider.textContent = urTekst(ben.afgang) + " – " + urTekst(ben.ankomst);
    if(ben.forsinkelse >= 1){
      const f = el("em"); f.textContent = " +" + ben.forsinkelse;
      tider.appendChild(f);
    }
    midt.appendChild(rute); midt.appendChild(tider);
    t.appendChild(midt);

    const s = el("div","trinstatus " + (klasse||""));
    s.textContent = tilstand;
    t.appendChild(s);
    return t;
  }

  const lokalNavn = lås.hjemad ? låsData.rute.lokalNavn : HJEM.navn;
  const målNavn   = lås.hjemad ? HJEM.navn : låsData.rute.lokalNavn;

  function erstatning(tekst){
    const e = el("div","erstattet");
    e.textContent = tekst;
    return e;
  }

  if(aAflyst){
    boks.appendChild(trin(låsData.a, lokalNavn, låsData.rute.skiftNavn,
      "aflyst", "aflystnu", true));
    boks.appendChild(erstatning(låsData.aErstat
      ? "Erstattet af" : "Ingen erstatning fundet"));
  }

  let s1, k1;
  if(nu < a.afgang){ s1 = "om " + minutter(nu, a.afgang) + " min"; k1 = "venter"; }
  else if(nu < a.ankomst){ s1 = "undervejs"; k1 = "kører"; }
  else { s1 = "ankommet"; k1 = "færdig"; }
  boks.appendChild(trin(a, lokalNavn, låsData.rute.skiftNavn, s1, k1));

  /* ── skiftet ── */
  const sk = el("div","trinskift");
  const skt = el("span");
  skt.textContent = "Skift på " + låsData.rute.skiftNavn + " · " + vent + " min";
  sk.appendChild(skt);
  const dom = el("span","skiftdom");
  if(togKørt && nu > a.ankomst && stramt){ dom.textContent = "mistet"; dom.classList.add("mistet"); }
  else if(togKørt){ dom.textContent = "overstået"; dom.classList.add("færdig"); }
  else if(stramt){ dom.textContent = "stramt — du skal skynde dig"; dom.classList.add("stramt"); }
  else { dom.textContent = "holder"; dom.classList.add("holder"); }
  sk.appendChild(dom);
  boks.appendChild(sk);

  /* tilstanden for ét ben, ud fra hvor langt du er nået */
  function status(fra, til){
    if(nu < fra) return ["afgår " + urTekst(fra), "venter"];
    if(nu < til) return ["undervejs", "kører"];
    return ["fremme", "færdig"];
  }

  if(b.videre){
    /* H til Ballerup og videre med C — hvert tog sit eget trin, så
       hver forsinkelse kan ses for sig.                            */
    const v = b.videre;
    const førsteBen = { linje: b.linje, art: b.art, afgang: b.afgang,
                        ankomst: v.fraAnkomst, forsinkelse: b.forsinkelse };
    const s2 = status(b.afgang, v.fraAnkomst);
    boks.appendChild(trin(førsteBen, låsData.rute.skiftNavn, v.sted, s2[0], s2[1]));

    const bvent = minutter(v.fraAnkomst, v.afgang);
    const sk2 = el("div","trinskift");
    const t2 = el("span");
    t2.textContent = "Skift på " + v.sted + " · " + bvent + " min";
    sk2.appendChild(t2);
    const d2 = el("span","skiftdom");
    if(v.afgang < nu){ d2.textContent = "overstået"; d2.classList.add("færdig"); }
    else if(bvent < 1){ d2.textContent = "meget stramt"; d2.classList.add("stramt"); }
    else { d2.textContent = "holder"; d2.classList.add("holder"); }
    sk2.appendChild(d2);
    boks.appendChild(sk2);

    const andetBen = { linje: v.linje, art: v.art, afgang: v.afgang,
                       ankomst: v.ankomst, forsinkelse: v.forsinkelse };
    const s3 = status(v.afgang, v.ankomst);
    boks.appendChild(trin(andetBen, v.sted, målNavn, s3[0], s3[1]));
  }else{
    if(bAflyst && låsData.b){
      boks.appendChild(trin(låsData.b, låsData.rute.skiftNavn, målNavn,
        "aflyst", "aflystnu", true));
      boks.appendChild(erstatning(låsData.bErstat
        ? "Erstattet af" : "Ingen erstatning fundet"));
    }
    const s2 = status(b.afgang, b.ankomst);
    boks.appendChild(trin(b, låsData.rute.skiftNavn, målNavn, s2[0], s2[1]));
  }

  /* ── nederst: hvornår du er fremme ── */
  const fod = el("div","låsfod");
  const fm = el("span","fodmærkat"); fm.textContent = "Fremme i " + målNavn;
  const ft = el("b"); ft.textContent = urTekst(b.ankomst);
  fod.appendChild(fm); fod.appendChild(ft);
  const rest = el("span","fodrest");
  const skred = lås.målAnkomst ? minutter(new Date(lås.målAnkomst), b.ankomst) : 0;
  if(skred >= 1){
    rest.textContent = skred + " min senere end planlagt";
    rest.classList.add("skredet");
  }else{
    rest.textContent = nu < b.ankomst ? "om " + minutter(nu, b.ankomst) + " min" : "";
  }
  fod.appendChild(rest);
  boks.appendChild(fod);

  /* ── kan du ikke nå det, så hvad så ── */
  if(stramt && !togKørt || (togKørt && nu < a.ankomst)){
    const grænse = new Date(a.ankomst.getTime() + gangtid*60000);
    let næste = null;
    låsData.to_.forEach(x => {
      if(x.aflyst || x.afgang < grænse || +x.planlagt === lås.toPlanlagt) return;
      if(!næste || x.ankomst < næste.ankomst) næste = x;
    });
    const alt = el("p","låsalt");
    alt.textContent = næste
      ? "Misser du den: " + næste.linje
        + (næste.videre ? " og " + næste.videre.linje : "")
        + " kl. " + urTekst(næste.afgang) + " — fremme " + urTekst(næste.ankomst)
      : "Misser du den, er der ingen anden mulighed lige nu.";
    boks.appendChild(alt);
  }

  holder.appendChild(boks);
}

function tegnBånd(kasse){
  const tr = el("tr","bånd");
  const td = el("td"); td.colSpan = 5;
  const e = el("span","etiket"); e.textContent = "Fremme";
  const b = el("b"); b.textContent = urTekst(kasse[0].ankomst);
  const n = el("span","antal");
  /* rejsetiden er forskellig fra vej til vej, fordi afgangstiden er
     det. Er der flere, vises spændet — ellers det ene tal.         */
  const tider = kasse.map(r => r.samlet);
  const kortest = Math.min.apply(null, tider);
  const længst  = Math.max.apply(null, tider);
  n.textContent = kortest === længst
    ? varighedTekst(kortest)
    : kortest + "–" + varighedTekst(længst);
  td.appendChild(e); td.appendChild(b); td.appendChild(n);

  /* vejret dér hvor du står af, på det tidspunkt du står af */
  const v = vejrPå(stedDer(), kasse[0].ankomst);
  if(v){
    const w = el("span","vejrder");
    w.appendChild(vejrIkon(v.kode, 26));
    const wg = el("b"); wg.textContent = v.grader + "°";
    w.appendChild(wg);
    w.title = (vejret[stedDer()]||{}).navn + " kl. "
            + urTekst(kasse[0].ankomst) + ": " + vejrOrd(v.kode)
            + (v.nedbør > 0 ? ", " + v.nedbør + " mm" : "");
    if(v.nedbør > 0) w.classList.add("vådt");
    td.appendChild(w);
  }
  tr.appendChild(td);
  return tr;
}

const ryd = () => { $("#beskeder").textContent=""; };
const sætPuls = t => { $("#puls").className="puls"+(t?" "+t:""); };

function aktiv(rute){
  if(rute.valgfri && !visAlt) return false;
  const d=idag();
  if(rute.fra && d < rute.fra) return false;
  if(rute.til && d >= rute.til) return false;
  return true;
}
function sætOverskrift(){
  $("#titel").textContent = hjemad ? "Hjem" : "Ud";
  $("#forklar").textContent = hjemad
    ? "Fra Gladsaxe til Ølstykke. Sorteret efter hvornår du er fremme."
    : "Fra Ølstykke til Gladsaxe. Sorteret efter hvornår du er fremme.";
}

async function opdater(){
  sætPuls("arbejder");
  document.body.classList.add("henter");
  await hentVejr();
  tegnVejrNu();
  Object.keys(kurv).forEach(k => delete kurv[k]);
  const brug = RUTER.filter(aktiv);
  const nu = new Date();

  try{
    const alle = [];
    const svigt = [], tomme = [];
    omvejSpor = hjemad ? "omvej ikke kørt" : "omvej kun hjemad";
    const førsteSider = visFlere ? 2 : 1;
    const andetSider  = 1 + (visFlere ? EKSTRA_SIDER_MERE : EKSTRA_SIDER);
    await Promise.all(brug.map(async rute => {
      /* Letbanen holder ikke ved selve stationen. skiftAf er der du
         står af, skiftPå er der du står på. Er de ikke sat, er det
         samme sted begge veje.                                      */
      const af = rute.skiftAf || rute.skiftId;
      const på = rute.skiftPå || rute.skiftId;
      const varsel = hjemad ? rute.varsel : VARSEL_HJEMMEFRA;

      try{
        let et, to_;
        if(hjemad){
          /* Flere rejser skal række længere på BEGGE ben — ellers har
             de sidste afgange intet tog at koble til og falder ud.   */
          et  = await hentBen(rute.lokalId, af,          rute.produkter, førsteSider);
          to_ = await hentBen(på,           HJEM.id,     S_TOG,          andetSider);
          /* H over Ballerup lægges til som ekstra muligheder — samme
             ankomst som det direkte C, men du sidder ned undervejs. */
          try{
            const omvej = await hentOmvej(på, andetSider);
            to_ = to_.concat(omvej);
          }catch(e){
            /* omvejen er en bonus; fejler den, kører resten */
            omvejSpor = "omvej fejlede: " + String(e.message||e);
          }
        }else{
          et  = await hentBen(HJEM.id,      på,          S_TOG,          førsteSider);
          to_ = await hentBen(af,           rute.lokalId, rute.produkter, andetSider);
        }
        kobl(rute, et, to_, nu, varsel).forEach(r => alle.push(r));
      }catch(e){
        /* H890_R betyder "ingen forbindelser" — et rigtigt svar, ikke
           en fejl. Fx når 166 ikke kører på det tidspunkt.            */
        const t = String(e.message||e);
        if(t.indexOf("H890") > -1 || t.toLowerCase().indexOf("no result") > -1){
          tomme.push(rute.skiftNavn);
        }else{
          svigt.push(rute.skiftNavn + " (" + t + ")");
        }
      }
    }));

    /* låsen hentes for sig, så den ikke påvirker listen */
    låsData = null;
    if(lås){
      try{ låsData = await hentLåsData(); }catch(e){ låsData = null; }
      if(låsData){
        const gældende = låsData.bErstat || låsData.b;
        if(gældende){
          lås.ankomst = +gældende.ankomst;   // følger med når den skubbes
          gemLås();
        }
      }
      /* slip når du er fremme */
      if(nu.getTime() > lås.ankomst + LÅS_MARGEN*60000){
        lås = null; låsData = null; gemLås(); start();
      }
    }
    tegnLås(nu);

    const kasser = grupper(alle)
      .slice(0, visFlere ? GRUPPER_LANGT : GRUPPER_KORT);

    ryd();
    const tabel = $("#tabel");
    Array.prototype.slice.call(tabel.querySelectorAll("tbody"))
      .forEach(t => t.parentNode.removeChild(t));

    if(!kasser.length){
      const krop = el("tbody"), tr = el("tr"), td = el("td","tom");
      td.colSpan = 5;
      td.textContent = "Ingen rejser lige nu.";
      tr.appendChild(td); krop.appendChild(tr); tabel.appendChild(krop);
    }else{
      kasser.forEach(kasse => {
        const krop = el("tbody","kasse");
        krop.appendChild(tegnBånd(kasse));
        kasse.forEach(r => krop.appendChild(tegnRække(r, nu)));
        tabel.appendChild(krop);
      });
    }
    $("#fod").textContent = "Opdateret "+urTekst(nu)+" · v"+VERSION+" · Data fra Rejseplanen."
      + (visFlere ? " · viser flere" : "")
      + (omvejSpor ? "\n" + omvejSpor : "");
    sætPuls(svigt.length ? "gal" : "");
    if(tomme.length){
      const p = el("p","rolig");
      p.textContent = "Ingen rejser over " + tomme.join(" eller ")
        + " lige nu — den linje kører ikke på dette tidspunkt.";
      $("#beskeder").appendChild(p);
    }
    if(svigt.length){
      visBesked("Én vej kunne ikke hentes",
        "Resten af tavlen er hentet og vist. Det der svigtede: " + svigt.join("; "));
    }

    tegnDrift(await hentDrift());
  }catch(e){
    sætPuls("gal"); ryd();
    visBesked("Kunne ikke hente rejser",
      "Rejseplanen svarede ikke som forventet. Tjek forbindelsen og prøv igen om lidt.",
      String(e.message||e));
  }
  document.body.classList.remove("henter");
}

function tikUr(){
  const nu=new Date();
  $("#ur").textContent=urTekst(nu);
  $("#dato").textContent=datoTekst(nu);
  if(!sover && (Date.now()-sidsteAktivitet) > DVALE_MINUTTER*60000){
    sover=true; clearInterval(timer); sætPuls("sover");
    visBesked("Tavlen er gået i dvale","Den holdt op med at hente nyt for at spare på kvoten. Tryk Opdater nu for at vække den.");
  }
}
function start(){
  clearInterval(timer);
  const sek = lås ? LÅS_SEKUNDER : OPDATER_SEKUNDER;
  timer=setInterval(()=>{ if(!document.hidden) opdater(); }, sek*1000);
}
function vågn(){ sidsteAktivitet=Date.now(); if(sover){ sover=false; start(); } }

$("#knapVend").addEventListener("click", ()=>{ hjemad=!hjemad; sætOverskrift(); vågn(); opdater(); });
$("#knapAlt").addEventListener("click", e=>{
  visAlt = !visAlt;
  e.currentTarget.setAttribute("aria-pressed", String(visAlt));
