<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familiekalender</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F1ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familiekalender">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F1ED;
  --day-here:#FFFFFF;
  --day-away:#E4E2DC;
  --surface:#FFFFFF;
  --ink:#1B1D1C;
  --muted:#71756F;
  --line:#D8D5CE;
  --line-strong:#1B1D1C;
  --chip:#F2F1ED;
  --holiday:#B0503A;
  --rail:#CFCCC4;
  --radius:14px;
  --tap:44px;
  --font-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:#121412;
  --day-here:#22251F;
  --day-away:#181A17;
  --surface:#1C1F1B;
  --ink:#ECEBE5;
  --muted:#9B9E96;
  --line:#32362F;
  --line-strong:#ECEBE5;
  --chip:#252821;
  --holiday:#E08A70;
  --rail:#3A3E36;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--line-strong);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- Topbjælke ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:14px 12px 10px;position:relative}
.segment{display:flex;flex:1;background:var(--chip);border-radius:999px;padding:3px;min-width:0}
.segment button{
  flex:1;height:38px;border-radius:999px;font-size:14px;font-weight:500;
  color:var(--muted);transition:background .15s,color .15s;
  display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;
}
.segment button[aria-pressed="true"]{
  background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.chev{display:none;font-size:10px;line-height:1;opacity:.6}
.segment button[aria-pressed="true"] .chev{display:inline}
.today-pill{
  height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none;
}
.today-pill:hover{border-color:var(--line-strong);color:var(--ink)}
.icon-btn{width:var(--tap);height:38px;border-radius:999px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--chip);color:var(--ink)}

.dropdown{
  position:absolute;top:100%;left:12px;right:12px;z-index:30;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;
}
.dropdown[hidden]{display:none}
.dd-year{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.dd-year span{font-family:var(--font-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.dd-year button{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.dd-year button:hover{background:var(--chip);color:var(--ink)}
.dd-body{max-height:46dvh;overflow-y:auto;padding:8px}
.dd-months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dd-months button{height:44px;border-radius:10px;font-size:14px;border:1px solid transparent}
.dd-months button:hover{background:var(--chip)}
.dd-weeks button{display:flex;width:100%;align-items:baseline;gap:10px;padding:11px 10px;border-radius:10px;font-size:15px;text-align:left}
.dd-weeks button:hover{background:var(--chip)}
.dd-weeks .w{font-weight:600;font-variant-numeric:tabular-nums;width:62px;flex:none}
.dd-weeks .r{font-size:13px;color:var(--muted)}
.dd-body [aria-selected="true"]{background:var(--chip);border-color:var(--line-strong);font-weight:700}

/* ---------- Datohoved ---------- */
.datehead{display:flex;align-items:center;gap:6px;padding:2px 8px 12px}
.datehead .nav{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.datehead .nav:hover{background:var(--chip);color:var(--ink)}
.datehead .center{flex:1;text-align:center;min-width:0}
.datehead h1{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datehead .sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}

/* ---------- Fælles ---------- */
.stage-wrap{flex:1;min-height:0;display:flex;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:0 14px 96px;will-change:transform}
.dot{width:16px;height:16px;border-radius:999px;display:inline-grid;place-items:center;
  font-size:9px;font-weight:700;color:rgba(0,0,0,.68);flex:none;font-family:var(--font-body);letter-spacing:-.02em}
.dot.lg{width:26px;height:26px;font-size:13px}
.dot.sm{width:7px;height:7px;font-size:0}
.dots{display:flex;gap:4px;align-items:center;flex:none}
.holiday-tag{color:var(--holiday);font-weight:600}

.banner{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:var(--holiday);color:#fff;font-size:14px;padding:10px 14px;
  display:flex;gap:10px;align-items:center;justify-content:center;text-align:center;
}
.banner[hidden]{display:none}
.banner button{text-decoration:underline;font-size:13px}

/* ---------- Dagsvisning ---------- */
.daycard{background:var(--day-here);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.daycard.away{background:var(--day-away)}
.strip{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:15px}
.strip .label{color:var(--muted);font-size:13px}
.strip.presence button{margin-left:auto;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted)}
.strip.presence button:hover{border-color:var(--line-strong);color:var(--ink)}

.rail{position:relative;padding:8px 0 14px}
.rail::before{content:"";position:absolute;left:74px;top:0;bottom:14px;width:1px;background:var(--rail)}
.slot{display:flex;align-items:flex-start;padding:7px 15px 7px 0;position:relative}
.slot .time{width:74px;flex:none;text-align:right;padding-right:14px;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--ink)}
.slot .time small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.slot .stem{position:absolute;left:74px;top:16px;width:12px;height:1px;background:var(--rail)}
.slot .body{flex:1;margin-left:20px;min-width:0}
.ev{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;display:block}
.ev:hover{border-color:var(--line-strong)}
.ev .t{font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.ev .d{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:15px}

/* ---------- Ugevisning ---------- */
.weekrow{display:flex;gap:12px;align-items:flex-start;background:var(--day-here);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;width:100%;text-align:left}
.weekrow.away{background:var(--day-away)}
.weekrow.today{border-color:var(--line-strong);border-width:2px;padding:10px 12px}
.weekrow .wd{width:56px;flex:none}
.weekrow .wd .n{font-family:var(--font-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.weekrow.today .wd .n{text-decoration:underline;text-underline-offset:3px}
.weekrow .wd .m{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.weekrow .items{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.witem{display:flex;gap:7px;align-items:baseline;font-size:14px;min-width:0}
.witem .wt{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;font-size:13px;width:38px}
.witem .wn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weekrow .none{font-size:13px;color:var(--muted)}
.meal{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}

/* ---------- Månedsvisning ---------- */
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mgrid{display:grid;grid-template-columns:30px repeat(7,1fr)}
.mhead{font-size:11px;color:var(--muted);text-align:center;padding:9px 0;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.wknum{font-size:11px;color:var(--muted);display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wknum:hover{background:var(--chip);color:var(--ink)}
.mcell{position:relative;min-height:62px;padding:5px 3px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--day-here);display:flex;flex-direction:column;align-items:center;gap:4px}
.mcell.away{background:var(--day-away)}
.mcell.other{opacity:.4}
.mcell .num{font-size:14px;font-variant-numeric:tabular-nums;line-height:1.6;width:26px;height:26px;display:grid;place-items:center;border-radius:999px}
.mcell.today .num{border:2px solid var(--line-strong);font-weight:700}
.mcell.holiday .num{color:var(--holiday);font-weight:600}
.mcell .mdots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:14px 4px 0;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}

/* ---------- Flydende knap ---------- */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;height:52px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px;box-shadow:0 6px 20px rgba(0,0,0,.22)}

/* ---------- Dialoger ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,22,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.backdrop.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto}
.sheet h2{font-family:var(--font-display);font-size:21px;font-weight:800;margin:0 0 4px}
.sheet .meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.field textarea{min-height:72px;resize:vertical}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.people{display:flex;flex-wrap:wrap;gap:7px}
.pchip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--bg)}
.pchip[aria-pressed="true"]{border-color:var(--line-strong);background:var(--chip);font-weight:600}
.check{display:flex;align-items:center;gap:9px;font-size:15px;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.actions{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;height:48px;border-radius:12px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--holiday);border-color:var(--line)}
.detail-desc{font-size:15px;white-space:pre-wrap;margin:10px 0 4px}
.detail-people{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.detail-people .pchip{pointer-events:none}
.err{color:var(--holiday);font-size:13px;margin-top:6px;display:none}
.err.show{display:block}
.menu-row{display:flex;width:100%;align-items:center;gap:11px;padding:14px 4px;font-size:15px;border-bottom:1px solid var(--line);text-align:left}
.menu-row:last-of-type{border-bottom:none}
svg{display:block}

/* ---------- Login ---------- */
.version{
  position:fixed;left:12px;bottom:10px;z-index:20;
  font-size:11px;color:var(--muted);opacity:.55;
  font-variant-numeric:tabular-nums;pointer-events:none;
}
.gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:center;justify-content:center;padding:22px}
.gate.open{display:flex}
.gate .box{width:100%;max-width:380px}
.gate h1{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.gate p.intro{color:var(--muted);font-size:14px;margin:0 0 22px}
</style>
</head>
<body>

<div class="banner" id="banner" hidden><span id="banner-text"></span><button id="banner-close">Skjul</button></div>

<div class="app">
  <div class="topbar">
    <div class="segment" role="group" aria-label="Vælg visning">
      <button id="v-day"   aria-pressed="true">Dag</button>
      <button id="v-week"  aria-pressed="false" aria-haspopup="listbox" aria-expanded="false">Uge<span class="chev">▾</span></button>
      <button id="v-month" aria-pressed="false" aria-haspopup="listbox" aria-expanded="false">Måned<span class="chev">▾</span></button>
    </div>
    <button class="today-pill" id="today-btn">I dag</button>
    <button class="icon-btn" id="theme-btn" aria-label="Skift mellem lys og mørk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" id="menu-btn" aria-label="Indstillinger">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>
    </button>

    <div class="dropdown" id="dropdown" hidden>
      <div class="dd-year">
        <button id="dd-prev" aria-label="Forrige år"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span id="dd-year-label">—</span>
        <button id="dd-next" aria-label="Næste år"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="dd-body" id="dd-body" role="listbox"></div>
    </div>
  </div>

  <div class="datehead">
    <button class="nav" id="prev" aria-label="Forrige"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="center"><h1 id="head-title">—</h1><div class="sub" id="head-sub"></div></div>
    <button class="nav" id="next" aria-label="Næste"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <div class="stage-wrap"><div class="scroll" id="stage"></div></div>
</div>

<button class="fab" id="add-btn">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Ny aftale
</button>

<div class="version" id="version"></div>

<!-- Login -->
<div class="gate" id="gate">
  <div class="box">
    <h1>Familiekalender</h1>
    <p class="intro">Log ind for at se og rette aftaler.</p>
    <div class="field"><label for="g-mail">E-mail</label><input type="email" id="g-mail" autocomplete="username"></div>
    <div class="field"><label for="g-pass">Kodeord</label><input type="password" id="g-pass" autocomplete="current-password"></div>
    <div class="err" id="g-err"></div>
    <div class="actions"><button class="btn primary" id="g-login">Log ind</button></div>
  </div>
</div>

<!-- Menu -->
<div class="backdrop" id="menu-back">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2>Indstillinger</h2>
    <div class="meta" id="menu-mail">—</div>
    <button class="menu-row" id="menu-export">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      Gem en kopi af alle data
    </button>
    <button class="menu-row" id="menu-reload">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>
      Hent data forfra
    </button>
    <button class="menu-row" id="menu-logout">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      Log ud
    </button>
    <div class="actions"><button class="btn" id="menu-close">Luk</button></div>
  </div>
</div>

<!-- Detaljer -->
<div class="backdrop" id="detail-back">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <h2 id="detail-title"></h2>
    <div class="meta" id="detail-meta"></div>
    <div class="detail-desc" id="detail-desc"></div>
    <div class="detail-people" id="detail-people"></div>
    <div class="actions">
      <button class="btn" id="detail-close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>Luk</button>
      <button class="btn" id="detail-edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Rediger</button>
      <button class="btn danger" id="detail-delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Slet</button>
    </div>
  </div>
</div>

<!-- Bekræft sletning -->
<div class="backdrop" id="confirm-back">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2>Slet aftalen?</h2>
    <div class="meta" id="confirm-meta"></div>
    <div class="actions">
      <button class="btn" id="confirm-no">Behold</button>
      <button class="btn primary" id="confirm-yes">Slet</button>
    </div>
  </div>
</div>

<!-- Opret / rediger -->
<div class="backdrop" id="edit-back">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <h2 id="edit-title">Ny aftale</h2>
    <div class="meta">Titel og hvem det gælder er nok — resten er frivilligt.</div>
    <div class="field">
      <label for="f-title">Titel</label>
      <input type="text" id="f-title" autocomplete="off" placeholder="Fx tandlæge">
      <div class="err" id="f-title-err">Skriv en titel.</div>
    </div>
    <div class="field">
      <label for="f-desc">Beskrivelse</label>
      <textarea id="f-desc" placeholder="Adresse, hvad der skal huskes, hvem der kører …"></textarea>
    </div>
    <div class="field">
      <label>Hvem gælder det?</label>
      <div class="people" id="f-people"></div>

<script>

/* Bruges indtil personer er hentet fra databasen */
let PEOPLE = [
  { id:"mor",     navn:"Mor",     kort:"M",  lys:"#E0BE6A", moerk:"#D9B255" },

];
const personById = id => PEOPLE.find(p => p.id === id);
const erMoerk = () => document.documentElement.getAttribute("data-theme") === "dark";
const farveFor = p => erMoerk() ? p.moerk : p.lys;

/* =======================================================================
   Datohjælpere — ISO-uger, mandag først
   ======================================================================= */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const sameDay = (a,b) => iso(a) === iso(b);

const UGEDAGE      = ["mandag","tirsdag","onsdag","torsdag","fredag","lørdag","søndag"];
const UGEDAGE_KORT = ["man","tir","ons","tor","fre","lør","søn"];
const MAANEDER     = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];

function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return addDays(x, -((x.getDay() + 6) % 7));
}
function isoWeek(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const week1 = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round((((t - week1) / 86400000) - 3 + ((week1.getDay() + 6) % 7)) / 7);
}
function isoWeekYear(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  return t.getFullYear();
}
function weeksInIsoYear(y){ return isoWeek(new Date(y,11,28)); }
function mondayOfIsoWeek(y,w){ return addDays(mondayOf(new Date(y,0,4)), (w-1)*7); }

/* Danske helligdage regnes ud fra påskedagen — ingen ekstern kilde.
   Store bededag er ikke med: afskaffet fra og med 2024. */
function easterSunday(year){
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4;
  const l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
const holidayCache = new Map();
function holidaysFor(year){
  if(holidayCache.has(year)) return holidayCache.get(year);
  const p = easterSunday(year), m = new Map();
  const put = (date,navn) => m.set(iso(date), navn);
  put(new Date(year,0,1), "Nytårsdag");
  put(addDays(p,-3), "Skærtorsdag");
  put(addDays(p,-2), "Langfredag");
  put(p, "Påskedag");
  put(addDays(p,1), "2. påskedag");
  put(addDays(p,39), "Kristi himmelfartsdag");
  put(addDays(p,49), "Pinsedag");
  put(addDays(p,50), "2. pinsedag");
  put(new Date(year,11,25), "Juledag");
  put(new Date(year,11,26), "2. juledag");
  holidayCache.set(year, m);
  return m;
}
const holidayName = ds => holidaysFor(Number(ds.slice(0,4))).get(ds) || null;

/* =======================================================================
   Data
   ======================================================================= */
let events = [];                          // aftaler fra databasen
const agnesOverrides = new Map();         // "2026-08-05" -> true/false
const dinners = new Map();                // dato -> ret fra madplanen
let mealStatus = "henter", mealError = "";

function agnesDefault(d){
  const lige = isoWeek(d) % 2 === 0;
  const wd = (d.getDay() + 6) % 7;              // 0 = mandag
  return lige ? (wd === 2 || wd === 3) : (wd !== 2 && wd !== 3);
}
function agnesHere(d){
  const ds = iso(d);
  return agnesOverrides.has(ds) ? agnesOverrides.get(ds) : agnesDefault(d);
}
const agnesChanged = d => agnesOverrides.has(iso(d)) && agnesOverrides.get(iso(d)) !== agnesDefault(d);

function eventsOn(ds){
  const md = ds.slice(5);
  return events
    .filter(e => e.date === ds || (e.yearly && e.date.slice(5) === md && e.date <= ds))
    .sort((a,b) => {
      if(a.allDay !== b.allDay) return a.allDay ? -1 : 1;
      if(a.allDay) return a.title.localeCompare(b.title,"da");
      return (a.start||"").localeCompare(b.start||"");
    });
}

/* ---------- Oversættelse mellem database og app ---------- */
const hhmm = t => t ? String(t).slice(0,5) : "";
const fraRaekke = r => ({
  id: r.id, date: r.dato, allDay: r.heldags,
  start: hhmm(r.start_tid), end: hhmm(r.slut_tid),
  title: r.titel, desc: r.beskrivelse || "",
  yearly: r.aarlig, people: r.personer || []
});
const tilRaekke = e => ({
  dato: e.date, heldags: e.allDay,
  start_tid: e.allDay ? null : (e.start || null),
  slut_tid: (e.allDay || !e.end) ? null : e.end,
  titel: e.title, beskrivelse: e.desc || "",
  aarlig: e.yearly, personer: e.people
});

/* =======================================================================
   Fejlbesked — ingen tavse fejl
   ======================================================================= */
function vis(besked){
  document.getElementById("banner-text").textContent = besked;

}

/* =======================================================================

   ======================================================================= */
async function hentAlt(forsoeg){
  skjulBesked();
  const [pRes, aRes, uRes] = await Promise.all([
    sb.from("personer").select("*").order("raekkefoelge"),
    sb.from("aftaler").select("*").order("dato"),
    sb.from("delebarn_undtagelser").select("*")
  ]);

  const fejl = pRes.error || aRes.error || uRes.error;
  if(fejl){
    // Uret på enheden og på serveren kan være et par sekunder ude af trit
    // lige efter login. Prøv igen én gang, før vi råber op.
    if(!forsoeg){
      await new Promise(r => setTimeout(r, 2500));
      return hentAlt(1);
    }
    vis("Kunne ikke hente data: " + fejl.message);
    return;
  }

  if(pRes.data && pRes.data.length){
    PEOPLE = pRes.data.map(p => ({
      id:p.id, navn:p.navn, kort:p.kort, lys:p.farve_lys, moerk:p.farve_moerk
    }));
  }
  events = aRes.data.map(fraRaekke);
  agnesOverrides.clear();
  uRes.data.forEach(r => agnesOverrides.set(r.dato, r.er_her));
  render();
}

/* =======================================================================
   Realtid — ændringer fra andre skærme kommer af sig selv
   ======================================================================= */
let kanal = null;

function lytPaaAendringer(){
  if(kanal) return;
  kanal = sb.channel("familiekalender")
    .on("postgres_changes", { event:"*", schema:"public", table:"aftaler" }, p => {
      if(p.eventType === "DELETE"){
        events = events.filter(x => x.id !== (p.old && p.old.id));
      } else {
        const ny = fraRaekke(p.new);
        const i = events.findIndex(x => x.id === ny.id);
        if(i > -1) events[i] = ny; else events.push(ny);
      }
      render();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"delebarn_undtagelser" }, p => {
      if(p.eventType === "DELETE"){
        if(p.old && p.old.dato) agnesOverrides.delete(p.old.dato);
      } else {
        agnesOverrides.set(p.new.dato, p.new.er_her);
      }
      render();
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"personer" }, () => hentAlt())
    .subscribe(status => console.info("Realtid:", status));
}

function stopLytning(){
  if(kanal){ sb.removeChannel(kanal); kanal = null; }
}

/* =======================================================================
   Aftensmad fra madplanen (Historik-fanen)
   ======================================================================= */
function parseCsv(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function normalizeDato(raw){
  const s = String(raw||"").trim();
  if(!s) return "";
  let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))         return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  if((m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/))) return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  if((m = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)/))) return m[1]+"-"+pad(Number(m[2])+1)+"-"+pad(m[3]);
  const d = new Date(s);
  return isNaN(d) ? "" : iso(d);
}
async function loadDinners(){
  try{
    const res = await fetch(HISTORIK_CSV, {cache:"no-store"});
    if(!res.ok) throw new Error("Arket svarede med status " + res.status);
    const rows = parseCsv(await res.text());
    if(rows.length < 2) throw new Error("Historik-fanen kom tom retur");
    const head = rows[0].map(h => h.trim().toLowerCase());
    const iDato = head.indexOf("dato"), iPlan = head.indexOf("plan_nu"), iSpist = head.indexOf("spist");
    if(iDato < 0 || iPlan < 0) throw new Error("Fandt ikke kolonnerne dato og plan_nu");
    dinners.clear();
    rows.slice(1).forEach(r => {
      const d = normalizeDato(r[iDato]);
      // Retten flytter fra plan_nu til spist når dagen er gået, så vi tager den der er udfyldt
      const p = (r[iPlan]||"").trim() || (iSpist > -1 ? (r[iSpist]||"").trim() : "");
      if(d && p) dinners.set(d, p);
    });
    mealStatus = "ok";
  }catch(err){
    mealStatus = "fejl";
    mealError = err.message || String(err);
    console.warn("Madplan kunne ikke hentes:", err);
  }
  render();
}

/* =======================================================================
   Tilstand
   ======================================================================= */
let view = "day";
let cursor = new Date();

/* =======================================================================
   Små byggeklodser
   ======================================================================= */
function dotEl(pid, size){
  const p = personById(pid); if(!p) return "";
  const cls = size ? "dot " + size : "dot";
  return '<span class="'+cls+'" style="background:'+farveFor(p)+'" title="'+p.navn+'">'+(size==="sm"?"":p.kort)+'</span>';
}
const dotsEl = (ids, size) => '<span class="dots">' + ids.map(id => dotEl(id, size)).join("") + '</span>';
const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const timeLabel = e => e.allDay ? "Hele dagen" : (e.end ? e.start + "–" + e.end : e.start);

/* =======================================================================
   Dagsvisning
   ======================================================================= */
function renderDay(){
  const d = cursor, ds = iso(d);
  const here = agnesHere(d);
  const list = eventsOn(ds);
  const hol = holidayName(ds);
  const meal = dinners.get(ds);

  let h = '<div class="daycard'+(here?"":" away")+'">';

  h += '<div class="strip presence">'
     +   '<span class="label">Agnes</span>'
     +   '<span>'+(here?"er her":"er hos sin far")+'</span>'
     +   '<button id="agnes-btn">'+(here?"Marker som hos far":"Marker som her")+'</button>'
     + '</div>';

  const mealText =
    mealStatus === "henter" ? '<span class="label">henter …</span>' :
    mealStatus === "fejl"   ? '<span class="holiday-tag">Madplanen kunne ikke hentes</span>' :
    meal ? esc(meal) : '<span class="label">ikke planlagt</span>';

  h += '<div class="strip">'
     +   '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M6 13v8"/><path d="M16 3c-1.7 1.2-2 3.4-2 5s.3 3.8 2 5v8"/></svg>'
     +   '<span class="label">Aftensmad</span><span>'+mealText+'</span>'
     + '</div>';

  if(mealStatus === "fejl"){
    h += '<div class="strip"><span class="label">Årsag</span><span class="label">'+esc(mealError)+'</span></div>';
  }
  if(hol){
    h += '<div class="strip"><span class="label">Helligdag</span><span class="holiday-tag">'+esc(hol)+'</span></div>';
  }

  if(!list.length){
    h += '<div class="empty">Ingen aftaler denne dag.<br>Tryk på Ny aftale for at lægge en ind.</div>';
  } else {
    h += '<div class="rail">';
    list.forEach(e => {
      const p0 = e.people[0] ? personById(e.people[0]) : null;
      h += '<div class="slot">'
         +   '<div class="time">'+(e.allDay ? '<small>hele<br>dagen</small>' : esc(e.start) + (e.end ? '<small>'+esc(e.end)+'</small>' : ''))+'</div>'
         +   '<span class="stem"></span>'
         +   '<div class="body">'
         +     '<button class="ev" data-ev="'+e.id+'" style="border-left-color:'+(p0?farveFor(p0):"var(--line)")+'">'
         +       '<span class="t"><span>'+esc(e.title)+(e.yearly?' <span aria-label="gentages hvert år">↻</span>':'')+'</span>'+dotsEl(e.people,"lg")+'</span>'
         +       (e.desc ? '<span class="d">'+esc(e.desc)+'</span>' : '')
         +     '</button>'
         +   '</div>'
         + '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

/* =======================================================================
   Ugevisning
   ======================================================================= */
function renderWeek(){
  const start = mondayOf(cursor), today = new Date();
  let h = "";
  for(let i=0;i<7;i++){
    const d = addDays(start,i), ds = iso(d);
    const list = eventsOn(ds), hol = holidayName(ds), meal = dinners.get(ds);
    const cls = "weekrow" + (agnesHere(d)?"":" away") + (sameDay(d,today)?" today":"");
    h += '<button class="'+cls+'" data-goto="'+ds+'">'
       +   '<span class="wd"><span class="n">'+d.getDate()+'</span><span class="m">'+UGEDAGE_KORT[i]+'</span></span>'
       +   '<span class="items">';
    if(hol) h += '<span class="witem"><span class="wn holiday-tag">'+esc(hol)+'</span></span>';
    if(!list.length && !hol) h += '<span class="none">—</span>';
    list.forEach(e => {
      h += '<span class="witem"><span class="wt">'+(e.allDay ? "—" : esc(e.start))+'</span>'
         +   dotsEl(e.people)+'<span class="wn">'+esc(e.title)+'</span></span>';
    });
    if(meal){
      h += '<span class="meal"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 3v8a2 2 0 0 0 4 0V3M6 13v8"/><path d="M16 3c-1.7 1.2-2 3.4-2 5s.3 3.8 2 5v8"/></svg>'+esc(meal)+'</span>';
    }
    h += '</span></button>';
  }
  return h;
}

/* =======================================================================
   Månedsvisning
   ======================================================================= */
function renderMonth(){
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const start = mondayOf(first), today = new Date();
  const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
  const offset = (first.getDay()+6)%7;
  const weeks = Math.ceil((offset + daysInMonth) / 7);

  let h = '<div class="month"><div class="mgrid">';
  h += '<div class="mhead"></div>' + UGEDAGE_KORT.map(w => '<div class="mhead">'+w+'</div>').join("");

  for(let w=0; w<weeks; w++){
    const wStart = addDays(start, w*7);
    h += '<button class="wknum" data-week="'+iso(wStart)+'" aria-label="Vis uge '+isoWeek(wStart)+'">'+isoWeek(wStart)+'</button>';
    for(let i=0;i<7;i++){
      const d = addDays(wStart,i), ds = iso(d);
      const ids = [...new Set(eventsOn(ds).flatMap(e => e.people))].slice(0,7);
      const cls = "mcell"
        + (agnesHere(d)?"":" away")
        + (d.getMonth()!==cursor.getMonth()?" other":"")
        + (sameDay(d,today)?" today":"")
        + (holidayName(ds)?" holiday":"");
      h += '<button class="'+cls+'" data-goto="'+ds+'">'
         +   '<span class="num">'+d.getDate()+'</span>'
         +   '<span class="mdots">'+ids.map(id => dotEl(id,"sm")).join("")+'</span>'
         + '</button>';
    }
  }
  h += '</div></div>';
  h += '<div class="legend">' + PEOPLE.map(p => '<span>'+dotEl(p.id)+p.navn+'</span>').join("") + '</div>';
  return h;
}

/* =======================================================================
   Tegn det hele
   ======================================================================= */
function render(){
  document.getElementById("v-day").setAttribute("aria-pressed", view==="day");
  document.getElementById("v-week").setAttribute("aria-pressed", view==="week");
  document.getElementById("v-month").setAttribute("aria-pressed", view==="month");

  const title = document.getElementById("head-title");
  const sub   = document.getElementById("head-sub");
  let subParts = [];

  if(view === "day"){
    const wd = UGEDAGE[(cursor.getDay()+6)%7];
    title.textContent = wd.charAt(0).toUpperCase()+wd.slice(1) + " " + cursor.getDate() + ". " + MAANEDER[cursor.getMonth()];
    subParts.push("Uge " + isoWeek(cursor), String(cursor.getFullYear()));
    if(agnesChanged(cursor)) subParts.push("Agnes-dagen er ændret manuelt");
  } else if(view === "week"){
    const s = mondayOf(cursor), e = addDays(s,6);
    title.textContent = "Uge " + isoWeek(s);
    subParts.push(s.getDate()+". "+MAANEDER[s.getMonth()]+" – "+e.getDate()+". "+MAANEDER[e.getMonth()], String(isoWeekYear(s)));
  } else {
    title.textContent = MAANEDER[cursor.getMonth()].charAt(0).toUpperCase()+MAANEDER[cursor.getMonth()].slice(1);
    subParts.push(String(cursor.getFullYear()));
  }
  sub.textContent = subParts.join(" · ");

  const stage = document.getElementById("stage");
  stage.innerHTML = view==="day" ? renderDay() : view==="week" ? renderWeek() : renderMonth();
  stage.scrollTop = 0;
}

/* =======================================================================
   Navigation
   ======================================================================= */
function setView(v){ view = v; closeDropdown(); render(); }
function step(dir){
  closeDropdown();
  if(view==="day")       cursor = addDays(cursor, dir);
  else if(view==="week") cursor = addDays(cursor, dir*7);
  else                   cursor = new Date(cursor.getFullYear(), cursor.getMonth()+dir, 1);
  render();
}
function goHome(){ cursor = new Date(); view = "day"; closeDropdown(); render(); }

/* Den gamle visning glider ud til den ene side, den nye ind fra den anden. */
const mindreBevaegelse = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let animerer = false;

function skiftMedGlid(dir){
  const el = document.getElementById("stage");
  if(animerer || mindreBevaegelse()){ el.style.cssText = ""; step(dir); return; }
  animerer = true;

  el.style.transition = "transform .16s ease-in, opacity .16s ease-in";
  el.style.transform  = "translateX(" + (dir > 0 ? -110 : 110) + "%)";
  el.style.opacity    = "0";

  setTimeout(() => {
    step(dir);                                   // henter det nye indhold
    el.style.transition = "none";
    el.style.transform  = "translateX(" + (dir > 0 ? 110 : -110) + "%)";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = "transform .22s cubic-bezier(.2,.7,.3,1), opacity .22s ease-out";
      el.style.transform  = "";
      el.style.opacity    = "1";
      setTimeout(() => { el.style.transition = ""; el.style.willChange = ""; animerer = false; }, 240);
    }));
  }, 160);
}

let ddMode = null, ddYear = null;
function closeDropdown(){
  ddMode = null;
  document.getElementById("dropdown").hidden = true;
  document.getElementById("v-week").setAttribute("aria-expanded","false");
  document.getElementById("v-month").setAttribute("aria-expanded","false");
}
function openDropdown(mode){
  ddMode = mode;
  ddYear = mode === "week" ? isoWeekYear(mondayOf(cursor)) : cursor.getFullYear();
  document.getElementById("dropdown").hidden = false;
  document.getElementById("v-" + mode).setAttribute("aria-expanded","true");
  drawDropdown();
}
function drawDropdown(){
  document.getElementById("dd-year-label").textContent = ddYear;
  const body = document.getElementById("dd-body");
  if(ddMode === "month"){
    const cur = cursor.getFullYear() === ddYear ? cursor.getMonth() : -1;
    body.innerHTML = '<div class="dd-months">' + MAANEDER.map((m,i) =>
      '<button role="option" data-month="'+i+'" aria-selected="'+(i===cur)+'">'+m.slice(0,3)+'</button>').join("") + '</div>';
  } else {
    const curWeek = isoWeekYear(mondayOf(cursor)) === ddYear ? isoWeek(cursor) : -1;
    const n = weeksInIsoYear(ddYear);
    let h = '<div class="dd-weeks">';
    for(let w=1; w<=n; w++){
      const s = mondayOfIsoWeek(ddYear,w), e = addDays(s,6);
      h += '<button role="option" data-week-nr="'+w+'" aria-selected="'+(w===curWeek)+'">'
         +   '<span class="w">Uge '+w+'</span>'
         +   '<span class="r">'+s.getDate()+'. '+MAANEDER[s.getMonth()].slice(0,3)+' – '+e.getDate()+'. '+MAANEDER[e.getMonth()].slice(0,3)+'</span>'
         + '</button>';
    }
    body.innerHTML = h + '</div>';
  }
  const sel = body.querySelector('[aria-selected="true"]');
  if(sel) sel.scrollIntoView({block:"center"});
}
function segmentClick(v){
  if(view !== v){ setView(v); return; }
  if(v === "day") return;
  if(ddMode === v) closeDropdown(); else openDropdown(v);
}

document.getElementById("v-day").onclick   = () => segmentClick("day");
document.getElementById("v-week").onclick  = () => segmentClick("week");
document.getElementById("v-month").onclick = () => segmentClick("month");
document.getElementById("today-btn").onclick = goHome;
document.getElementById("prev").onclick = () => skiftMedGlid(-1);
document.getElementById("next").onclick = () => skiftMedGlid(1);
document.getElementById("dd-prev").onclick = () => { ddYear--; drawDropdown(); };
document.getElementById("dd-next").onclick = () => { ddYear++; drawDropdown(); };
document.getElementById("dd-body").addEventListener("click", ev => {
  const m = ev.target.closest("[data-month]"), w = ev.target.closest("[data-week-nr]");
  if(m){ cursor = new Date(ddYear, Number(m.dataset.month), 1); closeDropdown(); render(); }
  if(w){ cursor = mondayOfIsoWeek(ddYear, Number(w.dataset.weekNr)); closeDropdown(); render(); }
});
document.addEventListener("click", ev => {
  if(!ddMode) return;
  if(ev.target.closest("#dropdown") || ev.target.closest(".segment")) return;
  closeDropdown();
});

  document.documentElement.setAttribute("data-theme", t);

  render();

/* =======================================================================
   Handlinger i visningen
   ======================================================================= */
document.getElementById("stage").addEventListener("click", async ev => {
  const goto = ev.target.closest("[data-goto]");
  const week = ev.target.closest("[data-week]");
  const evb  = ev.target.closest("[data-ev]");
  const agn  = ev.target.closest("#agnes-btn");

  if(agn){ await vendAgnesDag(); return; }
  if(evb){ openDetail(evb.dataset.ev); return; }
  if(week){ cursor = fromIso(week.dataset.week); setView("week"); return; }
  if(goto){ cursor = fromIso(goto.dataset.goto); setView("day"); return; }
});

async function vendAgnesDag(){
  const ds = iso(cursor);
  const ny = !agnesHere(cursor);
  const foer = new Map(agnesOverrides);

  if(agnesDefault(cursor) === ny){
    agnesOverrides.delete(ds);
    render();
    const { error } = await sb.from("delebarn_undtagelser").delete().eq("dato", ds);
    if(error){ agnesOverrides.clear(); foer.forEach((v,k)=>agnesOverrides.set(k,v)); render(); vis("Kunne ikke gemme: " + error.message); }
  } else {
    agnesOverrides.set(ds, ny);
    render();
    const { error } = await sb.from("delebarn_undtagelser").upsert({ dato: ds, er_her: ny });
    if(error){ agnesOverrides.clear(); foer.forEach((v,k)=>agnesOverrides.set(k,v)); render(); vis("Kunne ikke gemme: " + error.message); }
  }
}

let editingId = null;
let chosen = new Set();

function drawPeopleChips(){
  document.getElementById("f-people").innerHTML = PEOPLE.map(p =>
    '<button class="pchip" data-p="'+p.id+'" aria-pressed="'+chosen.has(p.id)+'">'+dotEl(p.id)+p.navn+'</button>'

}

  const id = b.dataset.p;
  if(id === "familie"){ chosen.clear(); chosen.add("familie"); }
  else { chosen.delete("familie"); chosen.has(id) ? chosen.delete(id) : chosen.add(id); }

});
function syncTimeFields(){
  document.getElementById("f-times").style.display = document.getElementById("f-allday").checked ? "none" : "flex";
}
document.getElementById("f-allday").onchange = syncTimeFields;

function openEditor(id){
  editingId = id || null;
  const e = id ? events.find(x => x.id === id) : null;
  document.getElementById("edit-title").textContent = e ? "Rediger aftale" : "Ny aftale";
  document.getElementById("f-title").value = e ? e.title : "";
  document.getElementById("f-desc").value  = e ? (e.desc||"") : "";
  document.getElementById("f-date").value  = e ? e.date : iso(cursor);
  document.getElementById("f-allday").checked = e ? !!e.allDay : false;
  document.getElementById("f-yearly").checked = e ? !!e.yearly : false;
  document.getElementById("f-start").value = e ? (e.start||"") : "";
  document.getElementById("f-end").value   = e ? (e.end||"") : "";
  chosen = new Set(e ? e.people : []);
  drawPeopleChips();
  syncTimeFields();
  document.getElementById("f-title-err").classList.remove("show");
  document.getElementById("f-people-err").classList.remove("show");
  document.getElementById("f-time-err").classList.remove("show");
  show("edit-back");
}
document.getElementById("add-btn").onclick     = () => openEditor(null);
document.getElementById("edit-cancel").onclick = () => hide("edit-back");

document.getElementById("edit-save").onclick = async () => {
  const title  = document.getElementById("f-title").value.trim();
  const allDay = document.getElementById("f-allday").checked;
  const start  = document.getElementById("f-start").value;
  const slut   = document.getElementById("f-end").value;
  const tidFejl = document.getElementById("f-time-err");

  const okTitle  = title.length > 0;
  const okPeople = chosen.size > 0;

  // Et tidsfelt med kun timetal læses som tomt af browseren.
  // Vi gætter ikke på minutterne — vi siger det.
  let okTid = true, tidBesked = "";
  if(!allDay){
    if(!start){
      okTid = false;
      tidBesked = "Skriv et helt starttidspunkt med både timer og minutter, eller sæt flueben i hele dagen.";
    } else if(slut && slut < start){
      okTid = false;
      tidBesked = "Sluttidspunktet ligger før starttidspunktet.";
    }
  }

  document.getElementById("f-title-err").classList.toggle("show", !okTitle);
  document.getElementById("f-people-err").classList.toggle("show", !okPeople);
  tidFejl.textContent = tidBesked;
  tidFejl.classList.toggle("show", !okTid);
  if(!okTitle || !okPeople || !okTid) return;

  const data = {
    title,
    desc:   document.getElementById("f-desc").value.trim(),
    date:   document.getElementById("f-date").value || iso(cursor),
    allDay,
    start:  allDay ? "" : start,
    end:    allDay ? "" : slut,
    yearly: document.getElementById("f-yearly").checked,
    people: [...chosen]
  };

  const knap = document.getElementById("edit-save");
  knap.disabled = true; knap.textContent = "Gemmer …";

  if(editingId){
    const { data: rows, error } = await sb.from("aftaler").update(tilRaekke(data)).eq("id", editingId).select();
    knap.disabled = false; knap.textContent = "Gem";
    if(error){ vis("Kunne ikke gemme: " + error.message); return; }
    const i = events.findIndex(x => x.id === editingId);
    if(i > -1 && rows && rows[0]) events[i] = fraRaekke(rows[0]);
  } else {
    const { data: rows, error } = await sb.from("aftaler").insert(tilRaekke(data)).select();
    knap.disabled = false; knap.textContent = "Gem";
    if(error){ vis("Kunne ikke gemme: " + error.message); return; }
    if(rows && rows[0]) events.push(fraRaekke(rows[0]));
    cursor = fromIso(data.date);
  }
  hide("edit-back");
  render();
};

/* =======================================================================
   Stryg til siden for at bladre
   Vandret bevægelse skal tydeligt overgå den lodrette, ellers er det
   en rulning og ikke et strøg.
   ======================================================================= */
(function(){
  const el = document.getElementById("stage");
  let sx = 0, sy = 0, aktiv = false, retning = null;

  const nulstil = () => {
    el.style.transition = "transform .18s ease";
    el.style.transform  = "";
    aktiv = false; retning = null;
  };

  el.addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return;
    if(document.querySelector(".backdrop.open")) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    aktiv = true; retning = null;
    el.style.transition = "none";
  }, {passive:true});

  el.addEventListener("touchmove", e => {
    if(!aktiv || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if(retning === null){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      retning = Math.abs(dx) > Math.abs(dy) * 1.4 ? "vandret" : "lodret";
    }
    if(retning === "vandret"){
      const traek = Math.sign(dx) * Math.min(Math.abs(dx) * 0.45, 70);
      el.style.transform = "translateX(" + traek + "px)";
    }
  }, {passive:true});

  el.addEventListener("touchend", e => {
    if(!aktiv) return;
    const dx = e.changedTouches[0].clientX - sx;
    const skift = retning === "vandret" && Math.abs(dx) > 60;
    aktiv = false; retning = null;
    if(skift){
      skiftMedGlid(dx < 0 ? 1 : -1);     // fortsætter fra fingerens position
    } else {
      el.style.transition = "transform .18s ease";
      el.style.transform  = "";
    }
  });

  el.addEventListener("touchcancel", nulstil);
})();

   Login
   ======================================================================= */
const gate = document.getElementById("gate");
async function logInd(){
  const mail = document.getElementById("g-mail").value.trim();
  const kode = document.getElementById("g-pass").value;
  const fejl = document.getElementById("g-err");
  const knap = document.getElementById("g-login");
  fejl.classList.remove("show");
  if(!mail || !kode){ fejl.textContent = "Udfyld både e-mail og kodeord."; fejl.classList.add("show"); return; }

  knap.disabled = true; knap.textContent = "Logger ind …";
  const { error } = await sb.auth.signInWithPassword({ email: mail, password: kode });
  knap.disabled = false; knap.textContent = "Log ind";

  if(error){
    fejl.textContent = error.message === "Invalid login credentials"
      ? "E-mail eller kodeord passer ikke."
      : error.message;
    fejl.classList.add("show");
    return;
  }
  document.getElementById("g-pass").value = "";
  gate.classList.remove("open");
  await start();
}
document.getElementById("g-login").onclick = logInd;
document.getElementById("g-pass").addEventListener("keydown", ev => { if(ev.key === "Enter") logInd(); });
